<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ebe8e1">
<title>Offres Feller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#ebe8e1; --mesh-a:#f2d3bd; --mesh-b:#cfdfcd; --mesh-c:#f1e4bf;
  --glass:#ffffff75; --glass-2:#ffffffa3; --glass-3:#ffffffd1; --solid:#f6f4ef; --float:#fdfcf9; --well:#17191a0f;
  --line:#17191a17; --line-2:#17191a29; --rim:#ffffffc7;
  --shadow:0 1px 0 #ffffffb3 inset, 0 24px 48px -30px #46321e47; --shadow-pop:0 24px 60px -18px #281e1452, 0 2px 6px #281e1414;
  --text:#17191a; --muted:#676a66; --faint:#8e918c; --cream:#fbf8f2;
  --butter:#f2c94c; --pine:#2f5c50; --on-pine:#fbf8f2; --tomato:#c8431f; --on-tomato:#fbf8f2; --ink:#17191a; --on-ink:#fbf8f2;
  --good:#2f7a52; --bad:#c8431f; --new:#c8431f; --new-soft:#f6ddd4; --warn:#8a5a12; --warn-soft:#f6ecd2;
  --r-card:26px; --r-tile:22px; --r-ctl:999px; --bar:72px; --ease:cubic-bezier(.2,.8,.2,1);
  /* alias pour le code existant */
  --paper:var(--glass-2); --ink-2:var(--muted); --ink-3:var(--faint); --accent:var(--pine); --accent-ink:var(--on-pine); --accent-soft:#2f5c5014; --ok:var(--good); --danger:var(--bad); --r:14px; --r-lg:var(--r-tile);
  font-family:var(--font);
}
:root[data-theme="dark"]{
  --bg:#17191a; --mesh-a:#3a2a22; --mesh-b:#22302a; --mesh-c:#33301f; --glass:#ffffff0d; --glass-2:#ffffff14; --glass-3:#ffffff1f; --solid:#20232a; --float:#262a30; --well:#ffffff0f;
  --line:#ffffff1a; --line-2:#ffffff2e; --rim:#ffffff22; --shadow:0 1px 0 #ffffff14 inset, 0 24px 48px -30px #00000080; --shadow-pop:0 24px 60px -18px #000000b0;
  --text:#f3f1ec; --muted:#b4b7b2; --faint:#858a85; --cream:#f3f1ec; --pine:#7cc2ad; --on-pine:#10201b; --ink:#f3f1ec; --on-ink:#17191a; --new-soft:#4a2a22; --warn-soft:#3a3120; --accent-soft:#7cc2ad22;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:var(--text);font-size:15px;line-height:1.45;background:var(--bg);
  background-image:radial-gradient(60% 50% at 8% 0%,var(--mesh-a) 0%,transparent 60%),radial-gradient(50% 45% at 100% 20%,var(--mesh-c) 0%,transparent 60%),radial-gradient(55% 55% at 70% 100%,var(--mesh-b) 0%,transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pine)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
img{background:#fff}
h1,h2{font-weight:600;letter-spacing:-.02em}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;z-index:90;padding:16px;background:var(--bg);background-image:radial-gradient(60% 50% at 8% 0%,var(--mesh-a) 0%,transparent 60%),radial-gradient(50% 45% at 100% 20%,var(--mesh-c) 0%,transparent 60%),radial-gradient(55% 55% at 70% 100%,var(--mesh-b) 0%,transparent 60%)}
#gate form{background:var(--glass-3);backdrop-filter:blur(14px);border:1px solid var(--rim);border-radius:var(--r-card);padding:32px;max-width:380px;width:100%;box-shadow:var(--shadow-pop)}
#gate h1{font-size:26px;margin:0 0 6px;font-weight:500}
#gate p{color:var(--muted);margin:0 0 18px;font-size:14px}
#gate input{width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:12px 16px;background:var(--float);font-size:18px;letter-spacing:.12em}
#gate .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 clamp(16px,1.6vw,28px)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;background:none;border:0;padding:4px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.brand::before{content:"F";display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:18px}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:11.5px;line-height:1;margin-top:3px;letter-spacing:0}
.sbox{flex:1;display:flex;align-items:center;background:var(--glass-3);backdrop-filter:blur(12px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-ctl);padding:0 6px 0 18px;min-width:0;transition:box-shadow .2s var(--ease)}
.sbox:focus-within{box-shadow:0 0 0 2px var(--ink) inset,var(--shadow)}
.sbox input{flex:1;border:0;background:none;outline:none;padding:12px 0;font-size:16px;min-width:0}
.sbox input::placeholder{color:var(--faint)}
.mic{width:38px;height:38px;border-radius:50%;border:0;background:var(--well);color:var(--text);display:grid;place-items:center;flex:none;transition:background .2s}
.mic:hover{background:var(--butter)}
.mic svg{width:18px;height:18px}
.mic.listening{background:var(--tomato);color:var(--on-tomato);animation:pulse 1.2s ease-in-out infinite}
.mic[disabled]{opacity:.35;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,67,31,.4)}50%{box-shadow:0 0 0 12px rgba(200,67,31,0)}}
@media (prefers-reduced-motion:reduce){.mic.listening{animation:none}}
.barbtn{height:44px;border-radius:var(--r-ctl);border:1px solid var(--rim);background:var(--glass-3);backdrop-filter:blur(12px);box-shadow:var(--shadow);padding:0 16px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease)}
.barbtn:hover{transform:translateY(-1px)}
.barbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.barbtn .badge{background:var(--tomato);color:var(--on-tomato);border-radius:999px;font-size:12px;padding:1px 7px;min-width:20px;text-align:center;font-weight:600}


/* ---------- layout ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .25s var(--ease);max-width:1840px;margin:0 auto}
.stage.chat-open{grid-template-columns:minmax(0,1fr) 440px}
@media (max-width:1000px){.stage.chat-open{grid-template-columns:minmax(0,1fr) 0}}
main{padding:8px clamp(16px,1.6vw,28px) 80px;min-width:0}

/* ---------- home ---------- */
.home h1{font-size:clamp(28px,3.4vw,40px);font-weight:500;margin:10px 0 6px;letter-spacing:-.03em;line-height:1.05}
.home .lead{color:var(--muted);margin:0 0 22px;max-width:58ch;font-size:15.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.hgrp{margin:0 0 22px}.hgrp .hgh{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:none;padding:0 0 10px;font:inherit;text-align:left;cursor:pointer;color:var(--text);border-bottom:1px solid var(--line);margin-bottom:12px}.hgrp .hgh b{font-size:18px;font-weight:700}.hgrp .hgh span{color:var(--ink-3);font-size:13px;flex:1}.hgrp .hgh i{font-style:normal;color:var(--ink-3);font-size:18px}.hgrp.col{margin-bottom:10px}.hgrp.col .hgh{margin-bottom:0}
.tile{cursor:pointer;font:inherit;color:inherit;position:relative;display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-card);overflow:hidden;text-align:left;padding:0;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-pop);outline:none}
.tile .pic{height:150px;display:grid;place-items:center;background:#fff;margin:10px 10px 0;border-radius:18px}
.tile .pic img{max-height:118px;max-width:78%;object-fit:contain}
.tile .pic.multi{grid-template-columns:1fr 1fr;padding:8px}
.tile .pic.multi img{max-height:100px}
.tile .txt{padding:14px 18px 18px}
.tile .txt b{display:block;font-weight:600;font-size:17px;letter-spacing:-.01em}
.tile .txt span{color:var(--muted);font-size:13.5px}
.tile.org{cursor:grab;outline:2px dashed var(--line-2);outline-offset:-2px}
.tile.org.over{outline:2px solid var(--pine)}
.tile .orgbar{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:4px}
.tile .orgbar .ob{border:1px solid var(--line-2);background:var(--float);border-radius:999px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.tile .orgbar .ob[disabled]{opacity:.35;cursor:default}
.tile .k{position:absolute;top:18px;left:18px;background:var(--tomato);color:var(--on-tomato);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;z-index:1}
.recent{margin-top:28px}
.recent h2{font-size:13px;font-weight:600;color:var(--faint);margin:0 0 8px;text-transform:none}
.recent .chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- wizard ---------- */
.wiz{max-width:1040px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 16px;font-size:13.5px;color:var(--muted)}
.crumbs button{background:var(--glass-3);border:1px solid var(--rim);border-radius:999px;padding:5px 12px;font-size:13px;box-shadow:var(--shadow)}
.crumbs .sep{color:var(--faint)}
.wiz h1{font-size:clamp(24px,3vw,34px);font-weight:500;margin:4px 0 4px;letter-spacing:-.03em}
.wiz .sub{color:var(--muted);margin:0 0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.opt{display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-tile);overflow:hidden;text-align:left;padding:0;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset,var(--shadow)}
.opt .pic{height:118px;display:grid;place-items:center;background:#fff;margin:8px 8px 0;border-radius:14px}
.opt .pic img{max-height:96px;max-width:78%;object-fit:contain}
.opt .pic.ico{background:var(--butter);font-size:34px}
.opt .txt{padding:12px 14px 14px}
.opt .txt b{display:block;font-weight:600;font-size:15px}
.opt .txt span{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.opt .rec{display:inline-block;margin-top:7px;font-size:11.5px;color:var(--pine);font-weight:600;font-style:normal}
.opts.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.compact .opt .pic{display:none}
.opts.compact .opt .txt{padding:16px 14px}
.wiz .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.wiz .actions .hint{color:var(--faint);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--float);border-radius:var(--r-ctl);padding:10px 16px;font-size:14px;font-weight:500;text-decoration:none;color:var(--text);transition:transform .15s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.link{border:0;background:none;color:var(--pine);padding:4px 2px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

/* ---------- results ---------- */
.res-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px}
.res-head h1{font-size:clamp(22px,2.6vw,30px);font-weight:500;margin:0;letter-spacing:-.03em;flex:1;min-width:200px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;align-items:center}
.chip{border:1px solid var(--rim);background:var(--glass-3);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip.new[aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.chip.x{color:var(--bad)}
.conf{display:flex;gap:12px;align-items:center;background:var(--warn-soft);border:1px solid var(--rim);border-radius:var(--r-tile);padding:12px 16px;margin:0 0 14px}
.conf .t{flex:1;font-size:14px}.conf .t b{font-weight:600;color:var(--warn)}
.group{margin:0 0 28px}
.group h2{font-size:17px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.01em}
.group h2 small{color:var(--faint);font-weight:400;font-size:13px}
.group.acc{margin-top:8px;padding-top:18px;border-top:1px dashed var(--line-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-card);overflow:hidden;position:relative;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.card.is-new{box-shadow:0 0 0 1.5px var(--tomato) inset,var(--shadow)}
.card .pic{height:160px;display:grid;place-items:center;background:#fff;margin:10px 10px 0;border-radius:18px;cursor:zoom-in}
.card .pic img{max-height:136px;max-width:82%;object-fit:contain}
.card .k{position:absolute;top:18px;left:18px;background:var(--tomato);color:var(--on-tomato);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;z-index:1}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .desc{font-weight:500;line-height:1.3;font-size:14.5px;min-height:38px}
.card .e{font-size:21px;font-weight:600;letter-spacing:-.01em}
.card .e small{font-size:11px;font-weight:600;color:var(--faint);margin-right:6px;letter-spacing:.04em}
.card .f{font-size:12.5px;color:var(--muted)}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.swatch{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);padding:0;box-shadow:0 0 0 1px #fff inset;cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.swl{font-size:12px;color:var(--muted);margin-left:4px}
.tag{font-size:11.5px;color:var(--muted);background:var(--well);border-radius:999px;padding:2px 9px}
.tag.ok{color:var(--good)}.tag.fu{color:var(--warn)}.tag.soon{color:var(--tomato);background:var(--new-soft)}
.card .act{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.card .act .btn{flex:1}
.card .act .btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.beta{display:inline-block;background:var(--butter,#f2c94c);color:#3b3000;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;vertical-align:middle;letter-spacing:.02em}
.tile .k.kb{background:var(--butter,#f2c94c);color:#3b3000}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line-2);border-radius:18px;padding:34px 16px;background:var(--float);cursor:pointer}
.drop.over{border-color:var(--pine);background:var(--accent-soft)}
.drop span{color:var(--muted);font-size:13.5px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.bar .indet{display:block;height:100%;width:35%;background:var(--pine);border-radius:99px;animation:indet 1.4s ease-in-out infinite}@keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
.pconf{display:grid;gap:10px;margin:6px 0 16px;padding:12px 14px;background:var(--float);border:1px solid var(--rim);border-radius:16px}
.psel small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:4px}
.psel .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.proom{margin-bottom:6px}
.prow2{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 12px;background:var(--glass-2);border:1px solid var(--rim);border-radius:14px;margin-bottom:6px}
.prow2 .n small{display:block;color:var(--ink-3);font-size:12px}
.prow2 .g{font-size:12px;color:var(--ink-3);white-space:nowrap}
.prow2.low{border-color:var(--butter,#f2c94c)}
@media (max-width:600px){.prow2{grid-template-columns:1fr auto}.prow2 .g{display:none}}
.tips{margin:0 0 12px;padding:10px 14px;background:var(--float);border:1px solid var(--line-2);border-radius:14px;font-size:13.5px}
.tips summary{cursor:pointer;font-weight:600;color:var(--pine)}
.tips ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2)}
.tips li{margin:4px 0}
.cards.rows{display:flex;flex-direction:column;gap:8px}
.cards.rows .card.row{flex-direction:row;align-items:center;gap:14px;padding:8px 12px 8px 8px}
.cards.rows .card.row .pic{height:64px;width:64px;margin:0;border-radius:12px;flex:none}
.cards.rows .card.row .pic img{max-height:56px;max-width:56px}
.cards.rows .card.row .body{padding:0;gap:3px;min-width:0}
.cards.rows .card.row .desc{min-height:0;font-size:14px}
.cards.rows .card.row .meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.cards.rows .card.row .meta .e{font-size:16px}
.cards.rows .card.row .act{margin:0;padding:0;flex:none;width:auto}
.cards.rows .card.row .act .btn{flex:none}
@media (max-width:760px){ .res-head{gap:8px} .res-head h1{font-size:21px;min-width:100%} .res-head .btn{padding:8px 12px;font-size:13.5px} .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none} .filters::-webkit-scrollbar{display:none} .filters .chip{flex:none} .cards.rows .card.row .act .btn.more-btn{display:none} }
.card .more{border-top:1px solid var(--line);padding:10px 16px 14px;font-size:13px}
.card .more .spec div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line-2)}
.card .more .spec span:first-child{color:var(--muted)}
.card .more h4{font-size:12px;font-weight:600;color:var(--faint);margin:10px 0 4px}
.card .more .accs div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0}
.card .more .accs .d{flex:1}
.empty{padding:30px 6px;color:var(--muted);max-width:54ch}
.empty h2{font-size:18px;font-weight:600;margin:0 0 8px;color:var(--text)}

/* ---------- fiche produit ---------- */
#pm{position:fixed;inset:0;background:rgba(23,25,26,.45);backdrop-filter:blur(6px);z-index:82;display:grid;place-items:center;padding:16px;overflow:auto}
#pm .sheet{position:relative;background:var(--solid);border:1px solid var(--rim);border-radius:var(--r-card);box-shadow:var(--shadow-pop);width:min(960px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr)}
@media (max-width:760px){#pm .sheet{grid-template-columns:1fr;max-height:100vh;border-radius:0}#pm{padding:0}}
#pm .pic{background:#fff;display:grid;place-items:center;padding:24px;min-height:300px;cursor:zoom-in}
#pm .pic img{max-width:100%;max-height:380px;object-fit:contain}
#pm .info{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px}
#pm .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);font-size:18px}
#pm h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em;line-height:1.25;padding-right:36px}
#pm .ids{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
#pm .ids .e{font-size:24px;font-weight:600;color:var(--text);letter-spacing:-.01em;width:100%}
#pm .ids .e small{font-size:11px;font-weight:600;color:var(--faint);margin-right:6px;letter-spacing:.04em}
#pm .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#pm .kv div{background:var(--glass-3);border:1px solid var(--rim);border-radius:14px;padding:8px 10px}
#pm .kv span{display:block;font-size:11.5px;color:var(--faint)}

<body>
<div id="gate" hidden>

  </form>
</div>

  </div>
  <button class="barbtn primary" id="openchat" type="button" title="Assistant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="t">Assistant</span></button>
  <button class="barbtn" id="openlist" type="button" title="Liste de matériel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="t">Liste</span><span class="badge" id="badge">0</span></button>
  <button class="barbtn" id="theme" type="button" title="Thème" aria-label="Changer de thème">◐</button>
</header>

<div class="stage" id="stage">
  <main id="view"></main>
  <aside id="chat" aria-label="Assistant"><div class="panel">
    <div class="head"><div><b>Assistant Feller & Schneider</b><small id="chatsub">Configurateur de vente · réponses avec N° ELDAS</small></div><div class="sp"></div><button type="button" id="chatreset">Nouveau</button><button type="button" id="chatclose" aria-label="Fermer">✕</button></div>

      <button class="mic" id="cmic" type="button" aria-label="Dicter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="send" id="csend" type="button">Envoyer</button>
    </div>
  </div></aside>
</div>

<div class="listbar" id="listbar" hidden><span id="listbartxt"></span><button class="btn small" type="button" id="lb-open">Voir la liste</button><button class="btn primary small" type="button" id="lb-pdf">Exporter en PDF</button></div>

  if(!it.m){ const d=' '+it.d+' '; it.m = / ENC /.test(d) ? 'ENC' : / AP /.test(d) ? 'AP' : /\.REG\b|\bREG\b|\bUM\b|rail DIN/.test(it.d+' '+it.f) ? 'REG' : ''; } });

function varImg(it, v){ const own='https://mam.feller.ch/pict/'+v[0]; const u=it.img||''; if(!/mam\.feller\.ch\/pict\//.test(u)||!it.c) return own; const re=new RegExp('\\.'+it.c.replace(/[.]/g,'\\.')+'(?=(\\.[0-9]{2})?$)'); const nu=re.test(u)?u.replace(re,'.'+v[2]):own; if(nu!==u) IMG_ALT[nu]=u; return nu; }

const STOP = new Set(['il','me','faut','je','veux','voudrais','cherche','besoin','un','une','des','du','de','d','le','la','les','l','pour','avec','et','a','au','aux','en','sur','dans','chez','ce','cet','cette','ces','mon','ma','mes','son','sa','ses','client','villa','maison','appartement','immeuble','ppe','chantier','piece','pieces','chambre','cuisine','salon','salle','bain','garage','cave','bureau','quel','quelle','quels','quelles','est','sont','ou','que','qui','svp','merci','tu','as','avez','vous','on','nous','type','modele','reference','ref','article','produit','feller','schneider','se']);
function search(q, F={}, limit=60){
  const toks = prep(q).split(' ').filter(t=>t && !STOP.has(t));
  if(!toks.length && !F.design && !F.mount && !F.ip && !F.nw) return [];
  const out=[];
  for(const it of DB){
    if(F.design && it._dsg!==F.design) continue;
    if(F.mount && it.m!==F.mount) continue;
    if(F.ip && !(it.ip && parseInt(it.ip.replace(/\D/g,''))>=44)) continue;
    if(F.nw && !it.nw) continue;
    let score=0, ok=true;
    for(const t of toks){ const hit = /^\d{1,2}$/.test(t) ? new RegExp('(^|[^0-9])'+t+'(?![0-9])').test(it._s) : (t.length<=3 && /^[a-z]+$/.test(t) ? new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z0-9])').test(it._s) : it._s.includes(t)); if(hit) score += (it.e===t||norm(it.f)===t) ? 50 : (it._s.indexOf(t)<40?3:1); else { ok=false; break; } }
    if(!ok) continue;
    if(toks.length && it._s.startsWith(toks[0])) score+=6; else if(toks.some(t=>t.length>3 && it._s.startsWith(t))) score+=4;
    if(/^(couvercle|kit|cadre|plaque|obturateur|piece de rechange|accessoire|porte|cache|bloc de bornes|connecteur|serrure|capuchon|etiquette|joint|vis |adaptateur|support|embase|rail|bornier|jeu de)/.test(it._s) && !toks.some(t=>/^(couvercle|kit|cadre|plaque|obturateur|rechange|accessoire|porte|cache|bloc|connecteur|serrure|capuchon|etiquette|joint|vis|adaptateur|support|embase|rail|bornier|jeu)/.test(t))) score-=3;
    if(/^(tableau|coffret|petit tableau|armoire|station de charge|disjoncteur|interrupteur|prise|poussoir|variateur|detecteur|thermostat|contacteur|telerupteur|minuterie|compteur|capteur|protection surtension|parasurtension|carillon|combinaison|regulateur|gestionnaire|wallbox)/.test(it._s)) score+=1.5;
    if(it.src==='sonepar') score-=1.5;
    if(!toks.some(t=>/^(tesys|lc1|lc2|gv2|gv3|zelio|nsx|compact|altivar|atv|harmony|modicon|12v|24v|48v|dc|vdc|moteur|industrie)$/.test(t)) && /\b(tesys|lc1|lc2|gv2|gv3|zelio|nsx|compact|altivar|atv|harmony|modicon|tm221|lrd|lr9|ca2|cad|xb4|xb5|rxm|rsb)\b|\b(12|24|48)v\b|\bvdc\b|\b277vd?\b|moteur/.test(it._s)) score-=4;
    if(toks.includes('surtension') && /\b(iprd|quick)\b/.test(it._s)) score+=3;
    if(toks.includes('contacteur') && !toks.some(t=>/auxiliaire|\d+v/.test(t)) && /auxiliaire|basse consommation|\bbc\b/.test(it._s)) score-=2;
    if(toks.includes('disjoncteur') && /\bclario\b/.test(it._s)) score+=2;
    if(toks.includes('disjoncteur') && !toks.some(t=>/^\(?[bdkz]\)?$/.test(t)) && /\(c\)/.test(it._s)) score+=1;
    if(it.nw) score+=8; if(it.buy) score+=1; if(it.fu) score-=2; if(it.soon) score-=1; if(/\.61\b|blanc| bc\b/.test(it._s)) score+=.5;
    out.push([score,it]);
  }
  out.sort((a,b)=>b[0]-a[0] || a[1].d.length-b[1].d.length);
  return out.slice(0,limit).map(x=>x[1]);
}

  const orig=el.dataset.orig||src; if(!el.dataset.orig) el.dataset.orig=orig; const step=+(el.dataset.step||0); const alt=IMG_ALT[orig];

function parsePrices(rows){ let ok=0, miss=[]; rows.forEach(r=>{ const cells=r.map(c=>String(c==null?'':c).trim()).filter(Boolean); if(cells.length<2) return; let key=null, price=null;
  for(const c of cells){ const k=priceKey(c); if(!key&&(byF[c]||byF[k]||window.__byE[k.replace(/\./g,'')])){ key=byF[c]?c:byF[k]?k:k.replace(/\./g,''); continue; } }
  if(!key){ const e=cells.find(c=>/^\d{3}[.\s]?\d{3}[.\s]?\d{3}$/.test(c)); if(e) key=e.replace(/\D/g,''); }
  const nums=cells.filter(c=>/^-?[\d'’ ]+([.,]\d{1,2})?$/.test(c)&&!/^\d{9}$/.test(c.replace(/\D/g,''))||/^\d+[.,]\d{1,2}$/.test(c)).map(c=>parseFloat(c.replace(/['’ ]/g,'').replace(',','.'))).filter(n=>!isNaN(n)&&n>0);
  price=nums.length?nums[nums.length-1]:null;

 }); savePrices(); return {ok, miss}; }

  return parsePrices(rows); }

// Logique Feller : 1 plaque de fixation SNAPFIX 27xx-EA + 1 élément par emplacement (.G.A / .Q.A) + 1 cadre (29xx standard ou 28xx prestige).
// Si Feller vend la combinaison pré-assemblée (« Combinaison ENC … schéma … »), on la propose à la place (1 seul N° ELDAS).
const CB_FUNCS=[
  ['7563','Interrupteur','schéma 3'],['7566','Inverseur','schéma 6'],['7561','Double','1/3+3/1'],['7563.AR','Poussoir','lumière'],
  ['40200.LED','Variateur LED','4–400 W'],['7592.AV','Stores','2 touches'],['87003','Prise T13',''],['87303','3× T13','1 emplacement'],
  ['87023','Prise T23','16 A'],['87063','Inter + T13','1 emplacement'],['1540.CC-A','USB-C ×2','18 W'],['1180-028','RJ45 ×2','EASYNET'],
  ['1262','Sonnerie',''],['751','Obturateur','vide']];
const CB_GRIDS=[[1,1],[2,1],[3,1],[1,2],[1,3],[2,2],[3,2],[2,3]];
const CB_PRESTIGE={'0A':'acier chromé poncé','0G':'acier chromé poli','0K':'laiton champagne','1G':'miroir satin','1C':'verre blanc','1E':'verre noir'};
const CB_PRE_NUM={'1x1':'2811','2x1':'2812','1x2':'2812.H','3x1':'2813','1x3':'2813.H','4x1':'2814','1x4':'2814.H','2x2':'2822','3x2':'2832','2x3':'2823.H','3x3':'2833'};
const CB_LINES={liv:{t:'EDIZIO.liv',comp:'G.A',frame:'GMI.A',cols:['61','60','65','67','35','56']}, std:{t:'STANDARDdue',comp:'Q.A',frame:'QMI.A',cols:['61','09']}};
function cbState(){ const c=view; c.line=c.line||'liv'; const L=CB_LINES[c.line]; if(!L.cols.includes(c.col)) c.col=L.cols[0]; c.cols=c.cols||2; c.rows=c.rows||1; c.cells=(c.cells||[]).slice(0,c.cols*c.rows); while(c.cells.length<c.cols*c.rows) c.cells.push(''); if(c.line!=='liv') c.frame='std'; c.frame=c.frame||'std'; c.n=c.n||1; if(c.sel==null||c.sel>=c.cells.length) c.sel=c.cells.findIndex(x=>!x); if(c.sel<0) c.sel=0; return c; }
function cbRef(code,c){ const L=CB_LINES[c.line]; return byF[`${code}.${L.comp}.${c.col}`]||null; }
function cbBom(c){
  const L=CB_LINES[c.line], key=`${c.rows}x${c.cols}`, mn=Math.min(c.cols,c.rows), mx=Math.max(c.cols,c.rows);
  const filled=c.cells.map(x=>x||'751'); const out=[], miss=[];
  if(c.line==='liv'&&c.frame==='std'&&c.cells.every(Boolean)&&c.cells.length>1){ const pre=byF[`${filled.join('/')}.GMI.A.${c.rows}X${c.cols}.${c.col}`]; if(pre) return {pre:true, lines:[{it:pre,q:1,role:'Combinaison pré-assemblée (plaque + éléments + cadre)'}], miss}; }
  const plate=byF[`27${mn}${mx}-EA`]; plate?out.push({it:plate,q:1,role:'Plaque de fixation SNAPFIX'}):miss.push(`plaque 27${mn}${mx}-EA`);
  const agg={}; filled.forEach(code=>{ agg[code]=(agg[code]||0)+1; });
  Object.entries(agg).forEach(([code,q])=>{ const it=cbRef(code,c); it?out.push({it,q,role:(CB_FUNCS.find(f=>f[0]===code)||[,'Élément'])[1]}):miss.push(`${code}.${L.comp}.${c.col}`); });
  let fr; if(c.frame==='std') fr=byF[`29${mn}${mx}.${L.frame}.${c.col}`]; else { const n=CB_PRE_NUM[key]; fr=n&&byF[`${n}.GMI.A.${c.frame}`]; }
  fr?out.push({it:fr,q:1,role:c.frame==='std'?'Cadre de recouvrement':'Cadre prestige '+CB_PRESTIGE[c.frame]}):miss.push(c.frame==='std'?`cadre 29${mn}${mx}.${L.frame}.${c.col}`:`cadre prestige ${key} ${c.frame}`);
  return {pre:false, lines:out, miss};
}

function cbClick(e){
  if(view.name!=='combo') return false; const c=view; const t=e.target;
  const ln=t.closest('[data-cbline]'); if(ln){ c.line=ln.dataset.cbline; render('keep'); return true; }
  const co=t.closest('[data-cbcol]'); if(co){ c.col=co.dataset.cbcol; render('keep'); return true; }
  const fr=t.closest('[data-cbframe]'); if(fr){ c.frame=fr.dataset.cbframe; render('keep'); return true; }
  const gr=t.closest('[data-cbgrid]'); if(gr){ const [a,b]=gr.dataset.cbgrid.split('x').map(Number); c.cols=a; c.rows=b; c.sel=null; render('keep'); return true; }
  const ce=t.closest('[data-cbcell]'); if(ce){ c.sel=+ce.dataset.cbcell; render('keep'); return true; }
  const fn=t.closest('[data-cbfn]'); if(fn){ c.cells[c.sel]=fn.dataset.cbfn; if(fn.dataset.cbfn){ const nx=c.cells.findIndex(x=>!x); if(nx>=0) c.sel=nx; } render('keep'); return true; }
  const nn=t.closest('[data-cbn]'); if(nn){ c.n=Math.max(1,Math.min(200,(c.n||1)+(+nn.dataset.cbn))); render('keep'); return true; }
  if(t.closest('#cbadd')){ const bom=cbBom(c); const lot=`Combinaison ${c.rows}×${c.cols} ${CB_LINES[c.line].t} ${(FCODE[c.col]||[c.col])[0]}${c.frame!=='std'?' · prestige '+CB_PRESTIGE[c.frame]:''}`; const note=c.cells.map(x=>(CB_FUNCS.find(f=>f[0]===x)||[,'obturateur'])[1]).join(' + '); bom.lines.forEach(l=>addToList(l.it,null,l.q*c.n,true,lot,note)); renderList(); toast(`${c.n} combinaison${c.n>1?'s':''} ajoutée${c.n>1?'s':''} (${bom.lines.length} réf.)`, view.origin==='project'&&curProject?{label:'Retour au relevé',fn:()=>go(curProject)}:{label:'Voir la liste',fn:openList},'ok'); return true; }
  return false;
}

function go(nv, opt){ opt=opt||{}; if(!opt.replace && view && !(view.name==='home'&&nv.name==='home')) { hist.push(view); if(hist.length>40) hist.shift(); } view=nv; forceTop=true; render('top'); if(!opt.replace){ try{ history.pushState({app:1,n:hist.length},''); }catch(e){} } }
function goBack(){ if(hist.length){ view=hist.pop(); if(view.busy){ view.busy=false; } forceTop=true; render('top'); } else { view={name:'home'}; forceTop=true; render('top'); } }
window.addEventListener('popstate',()=>{
  // Priorité aux panneaux ouverts (liste, assistant sur mobile, fiche, zoom) : le retour les ferme d'abord.
  if(!$('lb').hidden||!$('pm').hidden||!$('drawer').hidden||($('pdfm')&&!$('pdfm').hidden)||(chatOpen&&window.innerWidth<=1000)){ $('lb').hidden=true; $('pm').hidden=true; if($('pdfm')) $('pdfm').hidden=true; closeList(); if(window.innerWidth<=1000) closeChat(); try{ history.pushState({app:1,n:hist.length},''); }catch(e){} return; }
  if(hist.length){ goBack(); try{ history.pushState({app:1,n:hist.length},''); }catch(e){} }
  else if(view.name!=='home'){ view={name:'home'}; forceTop=true; render('top'); try{ history.pushState({app:1,n:0},''); }catch(e){} }
  // sinon : on est à l'accueil et la pile est vide → le navigateur quitte réellement la page.
});

  return `<section class="ostrip"><div class="oshead"><b>Mes offres</b><span>${OFFERS.length} au total</span><button class="btn small" type="button" data-goffers="1">Historique</button><button class="btn small primary" type="button" id="hnewoffer">+ Nouvelle</button></div>

      <div class="txt"><b>${esc(t.t)}</b><span>${esc(t.s)}</span></div></div>`;
  const shown=secs.filter(t=>!hidden.has(t.id)), hid=secs.filter(t=>hidden.has(t.id));
  return `<div class="home">
    ${organizing?'':offersStripHtml()}
    <div class="res-head"><h1>Que veux-tu proposer ?</h1><button class="btn small" type="button" id="orghome">${organizing?'Terminé':'Organiser'}</button></div>

function openSection(id){
  const t=SECTIONS.find(x=>x.id===id); if(!t) return;
  if(t.open){ t.open(); return; }
  if(t.flow){ startFlow(t.flow); return; }
  if(t.preset){ const fl=FLOWS[t.preset.flow]; const answers={...t.preset.answers}; const steps=visibleSteps(fl,answers); const step=Math.max(0, steps.findIndex(st=>answers[st.key]===undefined)); go({name:'wizard', flow:t.preset.flow, step, answers}); return; }
  if(t.groups){ F={design:'',mount:'',ip:false,nw:false}; const v={name:'results', title:t.t, groups:t.groups.map(g=>({...g})), q:t.q||'', from:'section'}; remember(t.t, v); go(v); }
}

function visibleSteps(flow,a){ return flow.steps.filter(st=>!st.when||st.when(a)).map(st=>typeof st.opts==='function'?{...st, opts:st.opts(a)}:st); }
function wizardHtml(){
  const flow0=FLOWS[view.flow]; const a=view.answers; const flow={...flow0, steps:visibleSteps(flow0,a)}; if(view.step>=flow.steps.length) view.step=flow.steps.length-1; const step=flow.steps[view.step];
  const crumbs = flow.steps.slice(0,view.step).map((s,i)=>{ const val=a[s.key]; const label=Array.isArray(val)? val.map(v=>(s.opts.find(o=>o.v===v)||{}).t||v).join(', ') : ((s.opts.find(o=>o.v===val)||{}).t||val||'—'); return `<button type="button" data-step="${i}">${esc(label)}</button><span class="sep">›</span>`; }).join('');
  const sel = a[step.key];
  const isSel = v => step.multi ? (sel||[]).includes(v) : sel===v;
  return `<div class="wiz">
    <div class="crumbs">${projCrumb()}<button type="button" data-step="-1">${esc(flow.title)}</button><span class="sep">›</span>${crumbs}<span style="color:var(--ink)">${view.step+1}/${flow.steps.length}</span></div>
    <h1>${esc(step.q)}</h1><p class="sub">${esc(step.s||(step.multi?'Plusieurs choix possibles.':'Un seul choix, tu pourras revenir.'))}</p>
    <div class="opts ${step.compact?'compact':''}">${step.opts.map(o=>`<button class="opt" type="button" data-v="${esc(o.v)}" aria-pressed="${isSel(o.v)}">

    const p=j.project; const h=p.hints||{};

// Retient ce que Nicola corrige sur les relevés : article choisi par fonction + ligne/couleur, équivalences de références citées dans les soumissions,

const saveLearn=()=>store.set('offre.learn',LEARN);
const learnKey=(k,c)=>[k,c.design||'',c.color||'',c.mount||'',c.smart||''].join('|');
function learnPick(lk,f,ref){ if(!f) return; if(lk&&!ref){ const o=LEARN.pick[lk]; LEARN.pick[lk]={f,n:(o&&o.f===f?o.n:0)+1,t:Date.now()}; } if(ref) LEARN.refs[String(ref).toUpperCase()]={f,t:Date.now()}; LEARN.n++; saveLearn(); }
function learnCtx(k,v){ if(!v) return; (LEARN.ctx[k]=LEARN.ctx[k]||{})[v]=(LEARN.ctx[k][v]||0)+1; saveLearn(); }
function learnRoom(from,to){ if(!from||!to||norm(from)===norm(to)) return; LEARN.rooms[norm(from)]=to; LEARN.n++; saveLearn(); }
const learnedCtx=()=>{ const o={}; for(const k in LEARN.ctx){ const e=Object.entries(LEARN.ctx[k]).sort((a,b)=>b[1]-a[1])[0]; if(e&&e[1]>=2) o[k]=e[0]; } return o; };

function learnNote(){ const L=[]; const c=learnedCtx(); if(Object.keys(c).length) L.push('Choix habituels : '+Object.entries(c).map(([k,v])=>k+' = '+v).join(', ')+'.');
  const rm=Object.entries(LEARN.rooms); if(rm.length) L.push('Noms de pièces : '+rm.slice(0,20).map(([a,b])=>`« ${a} » → « ${b} »`).join(', ')+'.');
  const rf=Object.entries(LEARN.refs).sort((a,b)=>b[1].t-a[1].t).slice(0,30); if(rf.length) L.push('Équivalences retenues (réf. citée → article Feller/Schneider choisi) : '+rf.map(([r,p])=>`${r} → ${p.f}`).join(', ')+'.');
  return L.join('\n'); }

    ${items.map(x=>{const it=byF[x.f]||x; return `<tr><td class="i"><img src="${esc(x.img||'')}" alt=""></td><td class="q num">${x.q}</td><td>${esc(x.d)}${x.note?`<div class="sp">${esc(x.note)}</div>`:''}</td><td class="e num">${esc(x.e||'—')}</td><td class="num">${esc(x.f)}</td>${showPrice?`<td class="num">${priceOf(x)==null?'n/d':chf(priceOf(x))}</td><td class="num">${priceOf(x)==null?'—':chf(priceOf(x)*x.q)}</td>`:''}<td class="doc"><a href="${docsUrl(it)}">Fiche &amp; brochures</a></td></tr>`}).join('')}</tbody></table>`).join('')}
    ${showPrice?`<div style="text-align:right;font-weight:600;margin-top:8px">Total brut (hors TVA, sans remise) : ${chf(lotTotal(list))}</div>`:''}${client.notes?`<div class="notes">${esc(client.notes)}</div>`:''}<div class="foot">Les numéros ELDAS permettent la commande chez tout grossiste électro suisse. Fiches techniques et brochures : online-katalog.feller.ch</div>`;
  window.print();
}
$('pdf').onclick=exportPdf;
document.addEventListener('click',e=>{
  if(e.target.id==='pdfclose'||e.target.id==='pdfm'){ $('pdfm').hidden=true; return; }
  if(e.target.id==='pdfshare'){ sharePdf(); return; }
  if(e.target.id==='pdfopen'&&pdfCache){ window.open(pdfCache.url,'_blank'); return; }
  if(e.target.id==='pdfprint'){ printList(); return; }
  if(e.target.id==='pdfretry'){ exportPdf(); return; }
  if(e.target.id==='pdfmail'){ location.href=`mailto:?subject=${encodeURIComponent('Liste de matériel'+(client.name?' – '+client.name:''))}&body=${encodeURIComponent('Bonjour,\n\n'+listText()+'\n\nMeilleures salutations\nNicola Strummiello')}`; return; }
  if(e.target.id==='pdfwa'){ const t=listText(); if(navigator.share&&window.innerWidth<=1000){ navigator.share({text:t}).catch(()=>{}); } else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank'); return; }
});

/* =============== assistant =============== */
const STARTERS=[
  {b:'Plan ou cahier des charges · bêta', t:'📐 Importer un plan, une photo de plan ou un cahier des charges'},
  {b:'Configuration d\'une pièce', t:'Rénovation appartement, le client veut du connecté sans bus'},
  {b:'Compatibilité', t:'Le thermostat Matter est-il compatible Philips Hue ?'},
  {b:'Projet bornes', t:'Projet 6 bornes de recharge pour une PPE'},
  {b:'Remplacement', t:'Quel remplaçant pour la référence 7563.FMI.61 en EDIZIO.liv ?'},
  {b:'Concurrent', t:'Le client a un tableau Hager Volta : que lui proposer et pourquoi ?'},
  {b:'Photo', t:'📷 Envoie la photo d\'un produit ou d\'un plan avec le bouton appareil photo'},
];
function openChat(){ chatOpen=true; $('stage').classList.add('chat-open'); renderChat(); setTimeout(()=>$('cin').focus(),50); }
function closeChat(){ chatOpen=false; $('stage').classList.remove('chat-open'); }
$('openchat').onclick=()=>chatOpen?closeChat():openChat(); $('chatclose').onclick=closeChat;
$('chatreset').onclick=()=>{ chat=[]; chatMeta=[]; renderChat(); persistChat(); };
// L'échange avec l'assistant survit à un rechargement (photos remplacées par leur mention, 24 derniers messages).
function persistChat(){ try{ const c=chat.slice(-24).map(m=>Array.isArray(m.content)?{role:m.role,content:'[photo envoyée] '+((m.content.find(x=>x.type==='text')||{}).text||'')}:m); sessionStorage.setItem('offre.chat', JSON.stringify({chat:c, meta:chatMeta.slice(-24)})); }catch(e){} }
try{ const sc=JSON.parse(sessionStorage.getItem('offre.chat')||'null'); if(sc&&Array.isArray(sc.chat)&&sc.chat.length){ chat=sc.chat; chatMeta=sc.meta||[]; } }catch(e){}
function renderChat(state){
  const th=$('thread');
  if(!chat.length && !state){ th.innerHTML=`<div class="msg a">Dis-moi le besoin du client. Je pose deux ou trois questions à choix, puis je te donne la configuration avec les N° ELDAS et des options à proposer.</div><div class="starters">${STARTERS.map(s=>`<button type="button" data-starter="${esc(s.t)}"><b>${esc(s.b)}</b>${esc(s.t)}</button>`).join('')}</div>`; return; }
  th.innerHTML = chat.map((m,i)=>{
    if(m.role==='user'){ const dm=chatMeta[i]&&chatMeta[i].display; const txt=typeof m.content==='string'?m.content:(m.content.find(c=>c.type==='text')||{}).text||''; return `<div class="msg u">${esc(dm||txt)}</div>`; }
    const meta=chatMeta[i]||{};
    const refs=(meta.refs||[]).map(x=>`<button type="button" class="add-ref" data-f="${esc(x.f)}" title="${esc(x.d)}"><img src="${PIC(x.f)}" alt="" onerror="this.remove()">+ ${esc(x.e)} · ${esc(x.d.slice(0,34))}${x.d.length>34?'…':''}</button>`).join('');
    const qs=(meta.questions&&meta.questions.length&&i===chat.length-1)?questionsHtml(meta.questions):'';
    const pr=meta.proposal?proposalHtml(meta.proposal,i):'';
    return `${m.content&&!(meta.proposal&&/^Proposition :/.test(m.content))?`<div class="msg a">${md(m.content)}${refs?`<div class="refs">${refs}</div>`:''}</div>`:''}${pr}${qs}`;
  }).join('') + (state==='loading'?`<div class="msg think">${progressHtml([{t:'Envoyé',st:'done'},{t:chatHasImage?'Analyse de la photo et recherche dans le catalogue':'Recherche dans le catalogue et rédaction',st:'run',s:'en général 10 à 30 s'}], chatStartedAt)}</div>`: state?`<div class="msg a" style="color:var(--danger)">${progressHtml([{t:'Pas de réponse',st:'err',s:state}])}${lastSend?`<div class="actions" style="margin-top:8px"><button class="btn small" type="button" id="cretry">Réessayer</button></div>`:''}</div>`:'');
  th.scrollTop=th.scrollHeight;
}
function proposalHtml(pr,i){
  const row=(x,up)=>`<label class="prow ${up?'up':''}"><input type="checkbox" data-f="${esc(x.f)}" data-q="${x.q}" ${up?'':'checked'}><img src="${esc(x.img||PIC(x.f))}" alt="" onerror="this.style.visibility='hidden'"><span class="t"><b data-open="${esc(x.f)}" style="cursor:pointer">${esc(x.d)}</b><small>${x.note?esc(x.note)+' · ':''}ELDAS ${esc(x.e)}</small></span><span class="q num">${x.q}×</span></label>`;
  return `<div class="prop" data-i="${i}"><div class="ph"><b>${esc(pr.title)}</b><small>${pr.items.reduce((a,x)=>a+x.q,0)} pièces · coche ce que tu gardes</small></div>${pr.summary?`<p>${md(pr.summary)}</p>`:''}${pr.items.map(x=>row(x,false)).join('')}${pr.upsells&&pr.upsells.length?`<div class="pu">Options à proposer</div>${pr.upsells.map(x=>row(x,true)).join('')}`:''}<div class="pa"><button class="btn primary small padd" type="button">Ajouter la sélection à la liste</button></div></div>`;
}
function questionsHtml(qs){
  return `<div class="qs" id="qs">${qs.map((q,qi)=>`<div class="q">${esc(q.q)}</div><div class="o" data-qi="${qi}" data-multi="${q.multi?1:0}">${q.options.map(o=>`<button type="button" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`).join('')}<div class="qsendrow"><button class="btn primary small" type="button" id="qsend" disabled>Envoyer les réponses</button><small>ou écris librement ci-dessous</small></div></div>`;
}
$('thread').addEventListener('click',e=>{
  if(e.target.id==='cretry'&&lastSend){ pendingImage=lastSend.image||null; pendingImages=lastSend.images||[]; sendChat(lastSend.text, lastSend.display); return; }
  const st=e.target.closest('[data-starter]'); if(st){ if(st.dataset.starter.startsWith('📐')){ closeChat(); go({name:'import'}); return; } if(st.dataset.starter.startsWith('📷')){ $('cfile').click(); return; } sendChat(st.dataset.starter); return; }
  const ob=e.target.closest('.qs .o button'); if(ob){ const grp=ob.parentElement; if(grp.dataset.multi==='1'){ ob.setAttribute('aria-pressed',String(ob.getAttribute('aria-pressed')!=='true')); } else { grp.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false')); ob.setAttribute('aria-pressed','true'); } $('qsend').disabled=!$('qs').querySelector('[aria-pressed="true"]'); return; }
  const pa=e.target.closest('.padd'); if(pa){ const box=pa.closest('.prop'); const prt=((chatMeta[+box.dataset.i]||{}).proposal||{}).title||'Assistant'; let n=0; box.querySelectorAll('input[type=checkbox]:checked').forEach(cb=>{ const it=byF[cb.dataset.f]; if(it){ addToList(it,null,+cb.dataset.q||1,true,prt); n++; } }); renderList(); toast(`${n} références ajoutées`,{label:'Voir la liste',fn:openList},'ok'); pa.textContent='Ajouté ✓'; return; }
  if(e.target.id==='qsend'){ const meta=chatMeta[chatMeta.length-1]; const ans=meta.questions.map((q,qi)=>{ const sel=[...$('qs').querySelectorAll(`.o[data-qi="${qi}"] button[aria-pressed="true"]`)].map(b=>b.dataset.o.replace(/\s*\(recommandé\)\s*/i,'')); return sel.length?`${q.q} ${sel.join(', ')}`:null; }).filter(Boolean).join(' · '); if(ans) sendChat(ans); return; }
});
let pendingImage=null, pendingImages=[], pendingText='', lastSend=null, chatStartedAt=0, chatHasImage=false;
$('cphoto').onclick=()=>$('cfile').click();
$('cfile').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; const data=await shrinkImage(f); pendingImage=data; $('cphoto').style.background='var(--butter)'; toast('Photo prête : décris ce que tu veux (équivalent, remplaçant, identification) puis Envoyer'); $('cin').focus(); e.target.value=''; });
async function shrinkImage(file){ const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); const max=1280; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.82).split(',')[1]; }
async function sendChat(text, display){
  text=(text||'').trim(); if(!text && !pendingImage && !pendingImages.length) return; if(!text) text='Identifie ce produit et propose l\'équivalent Feller / Schneider avec N° ELDAS.';
  if(!accessCode){ showGate(''); return; }
  if(!chatOpen) openChat();
  const imgs=pendingImage?[pendingImage]:pendingImages.slice(0,3); lastSend={text, display, image:pendingImage, images:imgs}; chatStartedAt=Date.now(); chatHasImage=!!imgs.length;
  const content = imgs.length ? [...imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text}] : text;
  chat.push({role:'user',content}); chatMeta.push({display: display || (imgs.length?'📷 '+text.slice(0,200):null)}); pendingImage=null; pendingImages=[]; $('cphoto').style.background=''; renderChat('loading'); $('cin').value=''; $('csend').disabled=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-access-code':accessCode},body:JSON.stringify({messages:chat.map((m,i)=>(i<chat.length-1&&Array.isArray(m.content))?{role:m.role,content:'[photo envoyée] '+((m.content.find(c=>c.type==='text')||{}).text||'')}:m),list:list.map(x=>({q:x.q,d:x.d,e:x.e}))})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){ chat.pop(); chatMeta.pop(); accessCode=''; store.set('offre.code',''); renderChat(); showGate("Code d'accès incorrect."); return; }
    if(!r.ok){ chat.pop(); chatMeta.pop(); renderChat(`${j.error||'Assistant indisponible.'}${j.detail?' — '+j.detail:''}`); return; }
    chat.push({role:'assistant',content:j.answer||(j.proposal?`Proposition : ${j.proposal.title}`:'')}); chatMeta.push({refs:j.refs||[],searches:j.searches||[],questions:j.questions||[],proposal:j.proposal||null});
    renderChat(); persistChat(); toast('Réponse reçue', null, 'ok');
  }catch(e){ chat.pop(); chatMeta.pop(); renderChat("Pas de connexion à l'assistant."); }
  finally{ $('csend').disabled=false; }
}
$('csend').onclick=()=>sendChat($('cin').value);
$('cin').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat($('cin').value); } });
$('cin').addEventListener('input',()=>{ const t=$('cin'); t.style.height='auto'; t.style.height=Math.min(120,t.scrollHeight)+'px'; });

/* =============== voix =============== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function wireMic(btn, onText){
  if(!SR){ btn.disabled=true; btn.title='Dictée non disponible dans ce navigateur'; return; }
  let rec=null, listening=false;
  btn.onclick=()=>{ if(listening){ rec.stop(); return; }
    rec=new SR(); rec.lang='fr-CH'; rec.interimResults=true; rec.continuous=false; let final='';
    rec.onstart=()=>{ listening=true; btn.classList.add('listening'); };
    rec.onresult=e=>{ final=[...e.results].map(r=>r[0].transcript).join(' '); onText(final,false); };
    rec.onerror=e=>{ toast(e.error==='not-allowed'?'Micro refusé : autorise le microphone pour ce site.':'Dictée interrompue, réessaie.'); };
    rec.onend=()=>{ listening=false; btn.classList.remove('listening'); if(final) onText(final,true); };
    rec.start(); };
}
wireMic($('mic'),(t,done)=>{ $('q').value=t; if(done){ if(/\?|^(est|quel|quelle|comment|pourquoi|peut|combien|y a|propose|je veux|il me faut|client)/i.test(t)||t.split(' ').length>6){ openChat(); sendChat(t); $('q').value=''; } else { F={design:'',mount:'',ip:false,nw:false}; go({name:'results',q:t}); } } });
wireMic($('cmic'),(t,done)=>{ $('cin').value=t; if(done) sendChat(t); });

/* =============== thème & init =============== */
$('theme').onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme = cur==='dark'?'light':'dark'; store.set('offre.theme',r.dataset.theme); };
const th=store.get('offre.theme',null); if(th) document.documentElement.dataset.theme=th;
// Reprise : on revient exactement où on était (vue + pile de retour), sauf si la sauvegarde date de plus de 12 h.
(function restoreNav(){ try{ const raw=sessionStorage.getItem('offre.nav')||localStorage.getItem('offre.nav'); if(!raw) return; const s=JSON.parse(raw); if(!s||!s.view||!s.view.name) return; if(s.t&&Date.now()-s.t>12*3600e3&&!sessionStorage.getItem('offre.nav')) return; if(s.view.name==='home'&&!(s.hist||[]).length) return; hist=(s.hist||[]).filter(v=>v&&v.name); view=s.view; if(view.name==='results'&&view.q&&!view.groups) $('q').value=view.q; if(view.name!=='home') toast('Reprise là où tu t\'étais arrêté', {label:'Accueil', fn:()=>{ hist=[]; go({name:'home'},{replace:true}); }}); }catch(e){} })();
renderList(); render();
if(window.innerWidth>1000 && accessCode) { /* panneau fermé par défaut : la recherche d'abord */ }
</script>
