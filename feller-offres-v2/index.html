<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ebe8e1">
<title>Offres Feller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#ebe8e1; --mesh-a:#f2d3bd; --mesh-b:#cfdfcd; --mesh-c:#f1e4bf;
  --glass:#ffffff75; --glass-2:#ffffffa3; --glass-3:#ffffffd1; --solid:#f6f4ef; --float:#fdfcf9; --well:#17191a0f;
  --line:#17191a17; --line-2:#17191a29; --rim:#ffffffc7;
  --shadow:0 1px 0 #ffffffb3 inset, 0 24px 48px -30px #46321e47; --shadow-pop:0 24px 60px -18px #281e1452, 0 2px 6px #281e1414;
  --text:#17191a; --muted:#676a66; --faint:#8e918c; --cream:#fbf8f2;
  --butter:#f2c94c; --pine:#2f5c50; --on-pine:#fbf8f2; --tomato:#c8431f; --on-tomato:#fbf8f2; --ink:#17191a; --on-ink:#fbf8f2;
  --good:#2f7a52; --bad:#c8431f; --new:#c8431f; --new-soft:#f6ddd4; --warn:#8a5a12; --warn-soft:#f6ecd2;
  --r-card:26px; --r-tile:22px; --r-ctl:999px; --bar:72px; --ease:cubic-bezier(.2,.8,.2,1);
  /* alias pour le code existant */
  --paper:var(--glass-2); --ink-2:var(--muted); --ink-3:var(--faint); --accent:var(--pine); --accent-ink:var(--on-pine); --accent-soft:#2f5c5014; --ok:var(--good); --danger:var(--bad); --r:14px; --r-lg:var(--r-tile);
  font-family:var(--font);
}
:root[data-theme="dark"]{
  --bg:#17191a; --mesh-a:#3a2a22; --mesh-b:#22302a; --mesh-c:#33301f; --glass:#ffffff0d; --glass-2:#ffffff14; --glass-3:#ffffff1f; --solid:#20232a; --float:#262a30; --well:#ffffff0f;
  --line:#ffffff1a; --line-2:#ffffff2e; --rim:#ffffff22; --shadow:0 1px 0 #ffffff14 inset, 0 24px 48px -30px #00000080; --shadow-pop:0 24px 60px -18px #000000b0;
  --text:#f3f1ec; --muted:#b4b7b2; --faint:#858a85; --cream:#f3f1ec; --pine:#7cc2ad; --on-pine:#10201b; --ink:#f3f1ec; --on-ink:#17191a; --new-soft:#4a2a22; --warn-soft:#3a3120; --accent-soft:#7cc2ad22;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:var(--text);font-size:15px;line-height:1.45;background:var(--bg);
  background-image:radial-gradient(60% 50% at 8% 0%,var(--mesh-a) 0%,transparent 60%),radial-gradient(50% 45% at 100% 20%,var(--mesh-c) 0%,transparent 60%),radial-gradient(55% 55% at 70% 100%,var(--mesh-b) 0%,transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pine)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
img{background:#fff}
h1,h2{font-weight:600;letter-spacing:-.02em}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;z-index:90;padding:16px;background:var(--bg);background-image:radial-gradient(60% 50% at 8% 0%,var(--mesh-a) 0%,transparent 60%),radial-gradient(50% 45% at 100% 20%,var(--mesh-c) 0%,transparent 60%),radial-gradient(55% 55% at 70% 100%,var(--mesh-b) 0%,transparent 60%)}
#gate form{background:var(--glass-3);backdrop-filter:blur(14px);border:1px solid var(--rim);border-radius:var(--r-card);padding:32px;max-width:380px;width:100%;box-shadow:var(--shadow-pop)}
#gate h1{font-size:26px;margin:0 0 6px;font-weight:500}
#gate p{color:var(--muted);margin:0 0 18px;font-size:14px}
#gate input{width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctl);padding:12px 16px;background:var(--float);font-size:18px;letter-spacing:.12em}
#gate .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 clamp(16px,1.6vw,28px)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;background:none;border:0;padding:4px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.brand::before{content:"F";display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:18px}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:11.5px;line-height:1;margin-top:3px;letter-spacing:0}
.sbox{flex:1;display:flex;align-items:center;background:var(--glass-3);backdrop-filter:blur(12px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-ctl);padding:0 6px 0 18px;min-width:0;transition:box-shadow .2s var(--ease)}
.sbox:focus-within{box-shadow:0 0 0 2px var(--ink) inset,var(--shadow)}
.sbox input{flex:1;border:0;background:none;outline:none;padding:12px 0;font-size:16px;min-width:0}
.sbox input::placeholder{color:var(--faint)}
.mic{width:38px;height:38px;border-radius:50%;border:0;background:var(--well);color:var(--text);display:grid;place-items:center;flex:none;transition:background .2s}
.mic:hover{background:var(--butter)}
.mic svg{width:18px;height:18px}
.mic.listening{background:var(--tomato);color:var(--on-tomato);animation:pulse 1.2s ease-in-out infinite}
.mic[disabled]{opacity:.35;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,67,31,.4)}50%{box-shadow:0 0 0 12px rgba(200,67,31,0)}}
@media (prefers-reduced-motion:reduce){.mic.listening{animation:none}}
.barbtn{height:44px;border-radius:var(--r-ctl);border:1px solid var(--rim);background:var(--glass-3);backdrop-filter:blur(12px);box-shadow:var(--shadow);padding:0 16px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease)}
.barbtn:hover{transform:translateY(-1px)}
.barbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.barbtn .badge{background:var(--tomato);color:var(--on-tomato);border-radius:999px;font-size:12px;padding:1px 7px;min-width:20px;text-align:center;font-weight:600}


/* ---------- layout ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .25s var(--ease);max-width:1840px;margin:0 auto}
.stage.chat-open{grid-template-columns:minmax(0,1fr) 440px}
@media (max-width:1000px){.stage.chat-open{grid-template-columns:minmax(0,1fr) 0}}
main{padding:8px clamp(16px,1.6vw,28px) 80px;min-width:0}

/* ---------- home ---------- */
.home h1{font-size:clamp(28px,3.4vw,40px);font-weight:500;margin:10px 0 6px;letter-spacing:-.03em;line-height:1.05}
.home .lead{color:var(--muted);margin:0 0 22px;max-width:58ch;font-size:15.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-card);overflow:hidden;text-align:left;padding:0;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-pop);outline:none}
.tile .pic{height:150px;display:grid;place-items:center;background:#fff;margin:10px 10px 0;border-radius:18px}
.tile .pic img{max-height:118px;max-width:78%;object-fit:contain}
.tile .pic.multi{grid-template-columns:1fr 1fr;padding:8px}
.tile .pic.multi img{max-height:100px}
.tile .txt{padding:14px 18px 18px}
.tile .txt b{display:block;font-weight:600;font-size:17px;letter-spacing:-.01em}
.tile .txt span{color:var(--muted);font-size:13.5px}
.tile .k{position:absolute;top:18px;left:18px;background:var(--tomato);color:var(--on-tomato);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;z-index:1}
.recent{margin-top:28px}
.recent h2{font-size:13px;font-weight:600;color:var(--faint);margin:0 0 8px;text-transform:none}
.recent .chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- wizard ---------- */
.wiz{max-width:1040px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 16px;font-size:13.5px;color:var(--muted)}
.crumbs button{background:var(--glass-3);border:1px solid var(--rim);border-radius:999px;padding:5px 12px;font-size:13px;box-shadow:var(--shadow)}
.crumbs .sep{color:var(--faint)}
.wiz h1{font-size:clamp(24px,3vw,34px);font-weight:500;margin:4px 0 4px;letter-spacing:-.03em}
.wiz .sub{color:var(--muted);margin:0 0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.opt{display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-tile);overflow:hidden;text-align:left;padding:0;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.opt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink) inset,var(--shadow)}
.opt .pic{height:118px;display:grid;place-items:center;background:#fff;margin:8px 8px 0;border-radius:14px}
.opt .pic img{max-height:96px;max-width:78%;object-fit:contain}
.opt .pic.ico{background:var(--butter);font-size:34px}
.opt .txt{padding:12px 14px 14px}
.opt .txt b{display:block;font-weight:600;font-size:15px}
.opt .txt span{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.opt .rec{display:inline-block;margin-top:7px;font-size:11.5px;color:var(--pine);font-weight:600;font-style:normal}
.opts.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.compact .opt .pic{display:none}
.opts.compact .opt .txt{padding:16px 14px}
.wiz .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.wiz .actions .hint{color:var(--faint);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--float);border-radius:var(--r-ctl);padding:10px 16px;font-size:14px;font-weight:500;text-decoration:none;color:var(--text);transition:transform .15s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.link{border:0;background:none;color:var(--pine);padding:4px 2px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

/* ---------- results ---------- */
.res-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px}
.res-head h1{font-size:clamp(22px,2.6vw,30px);font-weight:500;margin:0;letter-spacing:-.03em;flex:1;min-width:200px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;align-items:center}
.chip{border:1px solid var(--rim);background:var(--glass-3);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip.new[aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato);color:var(--on-tomato)}
.chip.x{color:var(--bad)}
.conf{display:flex;gap:12px;align-items:center;background:var(--warn-soft);border:1px solid var(--rim);border-radius:var(--r-tile);padding:12px 16px;margin:0 0 14px}
.conf .t{flex:1;font-size:14px}.conf .t b{font-weight:600;color:var(--warn)}
.group{margin:0 0 28px}
.group h2{font-size:17px;font-weight:600;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.01em}
.group h2 small{color:var(--faint);font-weight:400;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--glass-2);backdrop-filter:blur(14px);border:1px solid var(--rim);box-shadow:var(--shadow);border-radius:var(--r-card);overflow:hidden;position:relative;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.card.is-new{box-shadow:0 0 0 1.5px var(--tomato) inset,var(--shadow)}
.card .pic{height:160px;display:grid;place-items:center;background:#fff;margin:10px 10px 0;border-radius:18px;cursor:zoom-in}
.card .pic img{max-height:136px;max-width:82%;object-fit:contain}
.card .k{position:absolute;top:18px;left:18px;background:var(--tomato);color:var(--on-tomato);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;z-index:1}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .desc{font-weight:500;line-height:1.3;font-size:14.5px;min-height:38px}
.card .e{font-size:21px;font-weight:600;letter-spacing:-.01em}
.card .e small{font-size:11px;font-weight:600;color:var(--faint);margin-right:6px;letter-spacing:.04em}
.card .f{font-size:12.5px;color:var(--muted)}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--muted);background:var(--well);border-radius:999px;padding:2px 9px}
.tag.ok{color:var(--good)}.tag.fu{color:var(--warn)}.tag.soon{color:var(--tomato);background:var(--new-soft)}
.card .act{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.card .act .btn{flex:1}
.card .act .btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.card .more{border-top:1px solid var(--line);padding:10px 16px 14px;font-size:13px}
.card .more .spec div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line-2)}
.card .more .spec span:first-child{color:var(--muted)}
.card .more h4{font-size:12px;font-weight:600;color:var(--faint);margin:10px 0 4px}
.card .more .accs div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0}
.card .more .accs .d{flex:1}
.empty{padding:30px 6px;color:var(--muted);max-width:54ch}
.empty h2{font-size:18px;font-weight:600;margin:0 0 8px;color:var(--text)}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;background:rgba(23,25,26,.7);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:80;padding:20px;cursor:zoom-out}
#lb img{max-width:min(92vw,720px);max-height:82vh;background:#fff;border-radius:var(--r-card);padding:20px}
#lb .cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#fff;font-size:14px}

/* ---------- chat panel ---------- */
#chat{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));display:flex;flex-direction:column;min-width:0;padding:0 clamp(16px,1.6vw,28px) 16px 0}
#chat>.panel{display:flex;flex-direction:column;height:100%;background:var(--glass-3);backdrop-filter:blur(16px);border:1px solid var(--rim);border-radius:var(--r-card);box-shadow:var(--shadow-pop);overflow:hidden}
.stage:not(.chat-open) #chat{display:none}
@media (max-width:1000px){ .stage.chat-open #chat{position:fixed;inset:0;top:0;height:100vh;z-index:60;padding:0} .stage.chat-open #chat>.panel{border-radius:0;border:0} }
#chat .head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#chat .head b{font-weight:600}
#chat .head small{color:var(--faint);font-size:12.5px;display:block}
#chat .head .sp{flex:1}
#chat .head button{background:var(--well);border:0;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text)}
#thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:94%;line-height:1.5;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-radius:18px 18px 6px 18px;padding:10px 14px}
.msg.a{align-self:flex-start}
.msg.a a{word-break:break-all}
.msg .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg .refs button{border:1px solid var(--line-2);background:var(--float);border-radius:999px;padding:5px 11px 5px 5px;font-size:12.5px;display:inline-flex;gap:7px;align-items:center}
.msg .refs img{width:24px;height:24px;object-fit:contain;border-radius:50%}
.qs{align-self:stretch;background:var(--float);border:1px solid var(--rim);border-radius:var(--r-tile);padding:14px;box-shadow:var(--shadow)}
.qs .q{font-weight:600;margin:10px 0 7px;font-size:14px}
.qs .q:first-child{margin-top:0}
.qs .o{display:flex;flex-wrap:wrap;gap:6px}
.qs .o button{border:1px solid var(--line-2);background:var(--solid);border-radius:999px;padding:7px 13px;font-size:13.5px}
.qs .o button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.qs .send{margin-top:14px;display:flex;gap:8px;align-items:center}
.qs .send small{color:var(--faint)}
.msg.think{color:var(--faint);font-size:13.5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tomato);animation:blink 1s infinite;margin-left:4px}
@keyframes blink{50%{opacity:.2}}
.starters{display:grid;gap:8px;padding:4px 0}
.starters button{text-align:left;background:var(--float);border:1px solid var(--rim);border-radius:16px;padding:11px 14px;font-size:13.5px;box-shadow:var(--shadow)}
.starters button b{display:block;font-weight:600;margin-bottom:2px}
#chat .in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#chat textarea{flex:1;border:1px solid var(--line-2);border-radius:18px;padding:10px 14px;background:var(--float);resize:none;max-height:120px;font-size:14.5px;line-height:1.4}
#chat textarea:focus{outline:none;border-color:var(--ink)}
#chat .send{height:40px;border-radius:999px;background:var(--ink);color:var(--on-ink);border:0;padding:0 16px;font-weight:500}

/* ---------- list drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(23,25,26,.35);backdrop-filter:blur(4px);z-index:65}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));background:var(--solid);z-index:70;display:flex;flex-direction:column;border-radius:var(--r-card);border:1px solid var(--rim);box-shadow:var(--shadow-pop);overflow:hidden}
@media (max-width:700px){#drawer{top:0;right:0;bottom:0;width:100vw;border-radius:0}}
#drawer .head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
#drawer .head h2{font-size:18px;font-weight:600;margin:0;flex:1}
#drawer .head h2 small{color:var(--faint);font-weight:400;font-size:13px}
#drawer .body{flex:1;overflow:auto;padding:14px 18px}
.client{display:grid;gap:8px;margin-bottom:14px}
.client input,.client textarea{width:100%;border:1px solid var(--line-2);border-radius:14px;padding:9px 12px;background:var(--float)}
.client textarea{resize:vertical;min-height:40px}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) 64px 28px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}
.item img{width:48px;height:48px;object-fit:contain;border-radius:12px;border:1px solid var(--line)}
.item .d{font-size:13.5px;line-height:1.3}
.item .e{font-size:12.5px;color:var(--muted);margin-top:2px}
.item input.q{width:64px;text-align:center;border:1px solid var(--line-2);border-radius:999px;padding:6px 4px;background:var(--float)}
.item button.x{border:0;background:none;color:var(--faint);font-size:20px;line-height:1;padding:2px}
.item button.x:hover{color:var(--bad)}
.aside-empty{color:var(--faint);font-size:13.5px;padding:18px 0}
#drawer .foot{padding:12px 18px;border-top:1px solid var(--line);display:grid;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.tools{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.tools h3{font-size:13px;font-weight:600;color:var(--faint);margin:0 0 6px}
.tools a{display:block;font-size:13.5px;padding:5px 0;text-decoration:none;color:var(--text)}
.tools a span{color:var(--faint);font-size:12.5px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:14px;z-index:85;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-pop)}
.toast button{background:none;border:0;color:var(--butter);padding:0;font-weight:600}

/* ---------- print ---------- */
#print{display:none}
@media print{
  body{background:#fff!important;background-image:none!important;color:#000}
  .bar,.stage,#gate,#drawer,#scrim,#lb,.toast{display:none!important}
  #print{display:block;padding:0;font-size:12px;font-family:var(--font)}
  #print h1{font-size:20px;margin:0 0 2px}
  #print .sub{color:#555;margin-bottom:18px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{text-align:left;padding:7px 6px;border-bottom:1px solid #ccc;vertical-align:top}
  #print th{font-weight:600;border-bottom:2px solid #000}
  #print td.q{text-align:center;width:40px}
  #print td.e{white-space:nowrap;font-weight:600}
  #print td.i img{width:40px;height:40px;object-fit:contain}
  #print .notes{margin-top:16px;white-space:pre-wrap}
  #print .foot{margin-top:28px;color:#555;font-size:11px}
  #print a{color:#000;text-decoration:none}
  #print .doc{font-size:11px;color:#444}
  #print .sp{font-size:10.5px;color:#555}

}
@media (max-width:700px){.brand small{display:none}.barbtn span.t{display:none}.barbtn{padding:0 12px;height:40px}.bar{gap:8px;padding:8px 12px;height:auto;flex-wrap:wrap}.bar .sbox{order:10;flex-basis:100%}.brand{margin-right:auto}:root{--bar:104px}.tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tile .pic{height:104px;margin:6px 6px 0;border-radius:14px}.tile .pic img{max-height:84px}.tile .pic.multi img{max-height:70px}.tile .txt{padding:10px 12px 12px}.tile .txt b{font-size:14.5px}.tile .txt span{font-size:12.5px}.opts{grid-template-columns:repeat(2,1fr);gap:10px}.cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.card .pic{height:120px}.card .pic img{max-height:100px}.card .e{font-size:17px}.card .act{flex-direction:column}}
</style>

<body>

    <button class="btn primary" type="submit" style="width:100%;margin-top:8px;padding:10px">Entrer</button>

</div>

<header class="bar">

  <div class="sbox">

    <button class="mic" id="mic" type="button" aria-label="Dicter" title="Dicter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
  <button class="barbtn primary" id="openchat" type="button" title="Assistant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="t">Assistant</span></button>
  <button class="barbtn" id="openlist" type="button" title="Liste de matériel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="t">Liste</span><span class="badge" id="badge">0</span></button>
  <button class="barbtn" id="theme" type="button" title="Thème" aria-label="Changer de thème">◐</button>
</header>

<div class="stage" id="stage">
  <main id="view"></main>
  <aside id="chat" aria-label="Assistant"><div class="panel">
    <div class="head"><div><b>Assistant Feller & Schneider</b><small id="chatsub">Configurateur de vente · réponses avec N° ELDAS</small></div><div class="sp"></div><button type="button" id="chatreset">Nouveau</button><button type="button" id="chatclose" aria-label="Fermer">✕</button></div>
    <div id="thread"></div>
    <div class="in">
      <textarea id="cin" rows="1" placeholder="Décris le besoin ou réponds…" aria-label="Message à l'assistant"></textarea>
      <button class="mic" id="cmic" type="button" aria-label="Dicter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>

      <textarea id="c_notes" placeholder="Remarque pour le client (facultatif)"></textarea>

    <div class="aside-empty" id="aside-empty">Ajoute des articles depuis les résultats ou depuis une réponse de l'assistant. La liste reste enregistrée dans ce navigateur.</div>

    <button class="btn primary" id="pdf" type="button">Exporter en PDF</button>
    <div style="display:flex;gap:8px"><button class="btn" id="copy" type="button" style="flex:1">Copier en texte</button><button class="btn" id="clear" type="button" style="flex:1">Vider</button></div>
  </div>

<script src="data.js"></script>
<script>
/* =============== données =============== */
const DB = (window.FELLER_DATA && window.FELLER_DATA.items) || [];
const EXPORTED = window.FELLER_DATA && window.FELLER_DATA.exportedAt;
const DESIGNS = ['EDIZIOdue','EDIZIO.liv','STANDARDdue','NEVO','ELEMENT','SNAPFIX','FLF'];
const MOUNT = {ENC:'Encastré',AP:'Apparent',REG:'Tableau / REG'};
const PIC = f => 'https://mam.feller.ch/pict/'+f;
const norm = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[×x]/g,'x').replace(/\s+/g,' ').trim();
const SYN = [
  [/\bencastre(e|s)?\b/g,'enc'],[/\bapparent(e|s)?\b/g,'ap'],[/\bblanche?\b/g,'blanc'],[/\bnoire?\b/g,'noir'],
  [/\btriple\b/g,'3x'],[/\bdouble\b/g,'2x'],[/\bsimple\b/g,'1x'],[/\bprise(s)? (t|type) ?13\b/g,'prise t13'],[/\bt ?13\b/g,'t13'],[/\bt ?23\b/g,'t23'],
  [/\b(trois|3) (sur|slash|\/) (un|1)\b/g,'3/1'],[/\bsix (sur|\/) (un|1)\b/g,'6/1'],[/\bva[- ]et[- ]vient\b/g,'3/1'],[/\binter\b/g,'interrupteur'],
  [/\bedizio due\b/g,'ediziodue'],[/\bedizio liv\b/g,'edizio.liv'],[/\bstandard due\b/g,'standarddue'],[/\bbouton[- ]poussoir\b/g,'poussoir'],
  [/\bdiff(erentiel)?\b/g,'differentiel'],[/\bfi\/ls\b/g,'differentiel'],[/\btableau electrique\b/g,'tableau'],
];
const prep = q => { let s=norm(q); for(const [a,b] of SYN) s=s.replace(a,b); return s; };
DB.forEach(it=>{ it._s = norm([it.d,it.t,it.f,it.e,it.ean,it.m].join(' ')); it._dsg = DESIGNS.find(x=>norm(it.d).includes(norm(x))) || '';
  if(!it.m){ const d=' '+it.d+' '; it.m = / ENC /.test(d) ? 'ENC' : / AP /.test(d) ? 'AP' : /\.REG\b|\bREG\b|\bUM\b|rail DIN/.test(it.d+' '+it.f) ? 'REG' : ''; } });
const byF = Object.fromEntries(DB.map(it=>[it.f,it]));
const NEW_COUNT = DB.filter(x=>x.nw).length;

function search(q, F={}, limit=60){
  const toks = prep(q).split(' ').filter(Boolean);
  if(!toks.length && !F.design && !F.mount && !F.ip && !F.nw) return [];
  const out=[];
  for(const it of DB){
    if(F.design && it._dsg!==F.design) continue;
    if(F.mount && it.m!==F.mount) continue;
    if(F.ip && !(it.ip && parseInt(it.ip.replace(/\D/g,''))>=44)) continue;
    if(F.nw && !it.nw) continue;
    let score=0, ok=true;
    for(const t of toks){ if(it._s.includes(t)) score += (it.e===t||norm(it.f)===t) ? 50 : (it._s.indexOf(t)<40?3:1); else { ok=false; break; } }
    if(!ok) continue;
    if(it.nw) score+=8; if(it.buy) score+=1; if(it.fu) score-=2; if(it.soon) score-=1; if(/\.61\b|blanc| bc\b/.test(it._s)) score+=.5;
    out.push([score,it]);
  }
  out.sort((a,b)=>b[0]-a[0] || a[1].d.length-b[1].d.length);
  return out.slice(0,limit).map(x=>x[1]);
}

/* =============== configurateurs =============== */
const TOOLS = [
  {name:'Module de combinaison Feller', url:'https://online-katalog.feller.ch/fr/combinations', why:'Composer une combinaison et obtenir la référence exacte', rx:/combin|combi\b|schéma|schema|\d\s*[x×]\s*t13|t13\s*\+|\+\s*t13|\b\d\/\d[lp]?\s*\+/i},
  {name:'Planification Wiser by Feller', url:'https://www.feller.ch/fr/connected-buildings/wiser-by-feller/planification', why:'Dimensionner une installation Wiser', rx:/wiser|smart ?home|domotique/i},
  {name:'Planification SNAPFIX', url:'https://www.feller.ch/fr/gamme/snapfix/planification', why:'Choisir les kits SNAPFIX adaptés', rx:/snapfix/i},
  {name:'DispoSuite (planification Feller)', url:'https://www.feller.ch/fr/services/logiciel-de-planification-disposuite', why:'Planifier un projet complet', rx:/disposuite|projet complet|villa|immeuble/i},
  {name:'Kombi Tool Sonepar', url:'https://www.sonepar.ch/fr/kombitool', why:'Combinaisons chez le grossiste avec prix et stock', rx:/kombi|grossiste|sonepar|prix|stock/i},
  {name:'Configurateurs Schneider Electric (CH)', url:'https://www.se.com/ch/fr/work/products/tools/product-configurators/', why:'TGBT, onduleurs, bornes EVlink', rx:/tgbt|onduleur|\bups\b|evlink|wallbox|borne|recharge/i},
  {name:'Centre de téléchargement Feller', url:'https://online-katalog.feller.ch/fr/download-center', why:'Brochures, fiches techniques, plans cotés', rx:/brochure|fiche|catalogue|documentation/i},

/* =============== parcours guidés =============== */

  {v:'KNX', t:'KNX', s:'Bus, projets exigeants, intégrateur', img:'4708-1-C.GMI.A.L.P.61'},

const FLOWS = {

    {key:'mount', q:'Encastré ou apparent ?', opts:MOUNT_OPTS},

  ]},
  smart: { title:'Smart home', steps:[
    {key:'smart', q:'Quel niveau connecté ?', s:'Wiser pour la plupart des rénovations, KNX quand il y a un intégrateur, Matter pour quelques points autonomes.', opts:SMART_OPTS},
    {key:'design', q:'Quelle ligne de design ?', opts:DESIGN_OPTS.filter(o=>o.v!=='NEVO')},
    {key:'mount', q:'Encastré ou apparent ?', opts:MOUNT_OPTS},
    {key:'fn', q:'Quelles fonctions connecter ?', s:'Plusieurs choix possibles.', opts:FN_OPTS.filter(o=>['interrupteur','variateur','stores','thermostat','detecteur'].includes(o.v)), multi:true},
  ]},
  tableau: { title:'Tableau & protection', steps:[
    {key:'fam', q:'Quelle famille de coffret ?', opts:TAB_OPTS},

    {key:'rows', q:'Combien de rangées ?', opts:[{v:'1',t:'1 rangée'},{v:'2',t:'2 rangées'},{v:'3',t:'3 rangées',rec:'Appartement type'},{v:'4',t:'4 rangées'},{v:'',t:'Je ne sais pas'}], compact:true},
    {key:'prot', q:'Protection à ajouter ?', opts:[{v:'differentiel',t:'Disjoncteurs différentiels',s:'Clario iC40 FI/LS'},{v:'disjoncteur',t:'Disjoncteurs',s:'Clario iC40'},{v:'',t:'Coffret seul'}], compact:true, multi:true},
  ]},

  ]},
  bornes: { title:'Bornes de recharge', assistant:true, steps:[
    {key:'ctx', q:'Quel contexte ?', opts:[{v:'Villa',t:'Villa',s:'1 à 2 places'},{v:'PPE / immeuble',t:'PPE / immeuble',s:'Places locataires, facturation'},{v:'Entreprise / flotte',t:'Entreprise / flotte'},{v:'Public',t:'Parking public'}], compact:true},
    {key:'places', q:'Combien de places à équiper ?', opts:[{v:'1',t:'1'},{v:'2',t:'2'},{v:'3 à 6',t:'3 à 6'},{v:'7 à 20',t:'7 à 20'},{v:'plus de 20',t:'Plus de 20'}], compact:true},
    {key:'type', q:'AC ou DC ?', opts:[{v:'AC 11 kW',t:'AC 11 kW',s:'Villa, PPE, charge de nuit',rec:'Le cas général'},{v:'AC 22 kW',t:'AC 22 kW',s:'Entreprise, rotation'},{v:'DC rapide',t:'DC rapide',s:'Flotte, public, 50 kW et plus'}], compact:true},
    {key:'cable', q:'Câble attaché ou prise T2 ?', opts:[{v:'câble attaché',t:'Câble attaché',s:'Confort, villa'},{v:'prise T2',t:'Prise T2',s:'Collectif, public'}], compact:true},
    {key:'conn', q:'Connectivité ?', opts:[{v:'Wi-Fi',t:'Wi-Fi'},{v:'LAN',t:'LAN'},{v:'4G',t:'4G'},{v:'hors ligne',t:'Hors ligne'}], compact:true},
    {key:'lm', q:'Gestion de charge ?', opts:[{v:'dynamique',t:'Dynamique',s:'Mesure en tête, puissance limitée',rec:'PPE et flottes'},{v:'statique',t:'Statique',s:'Répartition fixe'},{v:'aucune',t:'Aucune'}], compact:true},
    {key:'bill', q:'Accès et facturation ?', opts:[{v:'libre',t:'Libre'},{v:'RFID',t:'Badge RFID'},{v:'backend OCPP',t:'Backend OCPP',s:'Facturation locataires / public'}], compact:true},

const FN_QUERY = {
  interrupteur:(a)=>a.smart ? `interrupteur ${a.smart} ${a.design||''} ${a.mount||''}` : `interrupteur 3/1 ${a.design||''} ${a.mount||''}`,

const FN_LABEL = Object.fromEntries(FN_OPTS.map(o=>[o.v,o.t]));

/* =============== état =============== */
const $ = id=>document.getElementById(id);
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} } };
let list = store.get('offre.items', []);
let client = store.get('offre.client', {name:'',notes:''});
let recent = store.get('offre.recent', []);
let F = {design:'',mount:'',ip:false,nw:false};
let view = {name:'home'};
let chat=[], chatMeta=[], chatOpen=false;
const esc = s => (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/^#{1,3}\s+(.+)$/gm,'<strong>$1</strong>').replace(/^[-•]\s+/gm,'• ');
const productUrl = it => 'https://online-katalog.feller.ch/fr/product?fnr='+encodeURIComponent(it.f);
const docsUrl = it => productUrl(it)+'#documents';
$('dbinfo').textContent = DB.length ? `${DB.length.toLocaleString('fr-CH')} articles · ${NEW_COUNT} nouveautés · ${EXPORTED ? new Date(EXPORTED).toLocaleDateString('fr-CH') : ''}` : 'catalogue introuvable';

let accessCode = store.get('offre.code','');
function showGate(msg){ $('gate').hidden=false; $('gateerr').textContent=msg||''; setTimeout(()=>$('gatecode').focus(),50); }

$('gateform').onsubmit=e=>{ e.preventDefault(); const c=$('gatecode').value.trim(); if(!c) return; accessCode=c; store.set('offre.code',c); $('gate').hidden=true; };

function toast(msg, action){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${esc(msg)}</span>${action?`<button type="button">${esc(action.label)}</button>`:''}`; if(action) t.querySelector('button').onclick=()=>{action.fn(); t.remove();}; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* =============== vues =============== */
function render(){
  const v=$('view');
  if(view.name==='home') v.innerHTML=homeHtml();
  else if(view.name==='wizard') v.innerHTML=wizardHtml();
  else if(view.name==='results') v.innerHTML=resultsHtml();
  window.scrollTo({top:0});
}
function go(nv){ view=nv; render(); }

function homeHtml(){
  const tiles=[
    {flow:'appareillage', t:'Appareillage', s:'Interrupteurs, prises, USB, variateurs', imgs:['7563.GMI.A.61','87303.GMI.A.61']},
    {flow:'smart', t:'Smart home', s:'Wiser, KNX, Matter', imgs:['3401.1.W.GMI.A.61','4708-1-C.GMI.A.L.P.61']},
    {flow:'tableau', t:'Tableau & protection', s:'Resi9, PrismaSeT, Clario iC40', imgs:['R9H10937B','A9D67410']},
    {flow:'exterieur', t:'Extérieur & humide', s:'NEVO, IP44 et plus', imgs:['7563.KS.NAP.Q.A.L.61.34','13431']},
    {flow:'bornes', t:'Bornes de recharge', s:'Cadrage du projet avec l\'assistant', ico:'⚡'},
    {flow:'nouveautes', t:'Nouveautés 2025–2026', s:`${NEW_COUNT} articles : Feller 4, Wiser, Clario, NEVO SNAPFIX`, imgs:['3400.D.T3.GMI.A.61','A9DSC3613'], k:'Nouveau'},
  ];
  return `<div class="home">
    <h1>Que veux-tu proposer ?</h1>
    <p class="lead">Choisis un parcours : deux ou trois choix en images et tu as les références avec N° ELDAS. Ou tape une référence, un produit ou une question dans la barre en haut.</p>
    <div class="tiles">${tiles.map(t=>`<button class="tile" type="button" data-flow="${t.flow}">${t.k?`<span class="k">${t.k}</span>`:''}
      <div class="pic ${t.imgs&&t.imgs.length>1?'multi':''}">${t.imgs?t.imgs.map(i=>`<img src="${PIC(i)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`).join(''):`<span style="font-size:48px">${t.ico}</span>`}</div>

  </div>`;
}

function wizardHtml(){
  const flow=FLOWS[view.flow]; const step=flow.steps[view.step]; const a=view.answers;
  const crumbs = flow.steps.slice(0,view.step).map((s,i)=>{ const val=a[s.key]; const label=Array.isArray(val)? val.map(v=>(s.opts.find(o=>o.v===v)||{}).t||v).join(', ') : ((s.opts.find(o=>o.v===val)||{}).t||val||'—'); return `<button type="button" data-step="${i}">${esc(label)}</button><span class="sep">›</span>`; }).join('');
  const sel = a[step.key];
  const isSel = v => step.multi ? (sel||[]).includes(v) : sel===v;
  return `<div class="wiz">
    <div class="crumbs"><button type="button" data-step="-1">${esc(flow.title)}</button><span class="sep">›</span>${crumbs}<span style="color:var(--ink)">${view.step+1}/${flow.steps.length}</span></div>
    <h1>${esc(step.q)}</h1><p class="sub">${esc(step.s||(step.multi?'Plusieurs choix possibles.':'Un seul choix, tu pourras revenir.'))}</p>
    <div class="opts ${step.compact?'compact':''}">${step.opts.map(o=>`<button class="opt" type="button" data-v="${esc(o.v)}" aria-pressed="${isSel(o.v)}">
      <div class="pic ${o.img?'':'ico'}">${o.img?`<img src="${PIC(o.img)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('ico');this.remove()">`:''}</div>
      <div class="txt"><b>${esc(o.t)}</b>${o.s?`<span>${esc(o.s)}</span>`:''}${o.rec?`<i class="rec">Recommandé · ${esc(o.rec)}</i>`:''}</div></button>`).join('')}</div>
    <div class="actions">${step.multi?`<button class="btn primary" id="wnext" type="button" ${(sel||[]).length?'':'disabled'}>Continuer</button>`:''}<button class="btn" id="wskip" type="button">Passer</button><span class="hint">${flow.assistant?'À la fin, l\'assistant structure le projet et chiffre la distribution.':'À la fin : les références, puis l\'assistant pour une configuration complète si tu veux.'}</span></div>
  </div>`;
}

function resultsHtml(){
  const r=view;
  const anyF = F.design||F.mount||F.ip||F.nw;
  const chip=(label,key,val,cls='')=>`<button class="chip ${cls}" type="button" data-k="${key}" data-v="${val}" aria-pressed="${String(F[key])===String(val) || (typeof F[key]==='boolean' && F[key] && val==='1')}">${label}</button>`;
  const filters = `<div class="filters">${chip('Nouveautés','nw','1','new')}${Object.entries(MOUNT).map(([v,l])=>chip(l,'mount',v)).join('')}${chip('IP44+','ip','1')}${DESIGNS.slice(0,5).map(d=>chip(d,'design',d)).join('')}${anyF?'<button class="chip x" type="button" data-k="reset">Réinitialiser</button>':''}</div>`;
  const conf = r.q ? TOOLS.filter(t=>t.rx.test(r.q)).slice(0,1).map(t=>`<div class="conf"><div class="t"><b>Configurateur conseillé :</b> ${esc(t.name)} <span style="color:var(--ink-2)">· ${esc(t.why)}</span></div><a class="btn small" href="${t.url}" target="_blank" rel="noopener">Ouvrir</a></div>`).join('') : '';
  let groups;
  if(r.groups) groups = r.groups.map(g=>({label:g.label, items:search(g.q,{...F, ...(g.F||{})},24)}));
  else groups = [{label:'', items:search(r.q||'',F,60)}];
  const total = groups.reduce((a,g)=>a+g.items.length,0);
  const body = total ? groups.map(g=>`<section class="group">${g.label?`<h2>${esc(g.label)} <small>${g.items.length} article${g.items.length>1?'s':''}</small></h2>`:''}<div class="cards">${g.items.map(cardHtml).join('')}</div></section>`).join('')
    : `<div class="empty"><h2>Aucun article ne correspond</h2>Essaie moins de mots, retire un filtre, ou pose la question à l'assistant : il cherche avec d'autres formulations.<div style="margin-top:12px"><button class="btn primary" type="button" id="askthis">Demander à l'assistant</button></div></div>`;
  return `<div class="res-head"><h1>${esc(r.title||r.q||'Résultats')}</h1>${r.brief?`<button class="btn primary" type="button" id="askconfig">Configuration complète par l'assistant</button>`:''}<button class="btn" type="button" id="back">${r.from==='wizard'?'Modifier les choix':'Accueil'}</button></div>${filters}${conf}<div class="count" style="color:var(--ink-3);font-size:13px;margin-bottom:8px">${total} article${total>1?'s':''}${!r.groups&&total===60?' · affichage limité, précise la recherche':''}</div>${body}`;
}

      <div class="f num">N° Feller ${esc(it.f)}</div>
      <div class="tags">${it._dsg?`<span class="tag">${esc(it._dsg)}</span>`:''}${it.m?`<span class="tag">${MOUNT[it.m]}</span>`:''}${it.ip?`<span class="tag">${esc(it.ip)}</span>`:''}${it.soon?'<span class="tag soon">Pas encore disponible</span>':it.buy?'<span class="tag ok">Disponible</span>':'<span class="tag">Non commandable</span>'}${it.fu?`<span class="tag fu">Remplacé par ${esc(it.fu)}</span>`:''}</div>

function specHtml(it){
  const rows=(it.tech||[]).filter(x=>!/^(false|true)$/.test(x[1]) || /Compatible/.test(x[0])).map(x=>`<div><span>${esc(x[0])}</span><span>${esc(x[1]==='true'?'Oui':x[1]==='false'?'Non':x[1])}${x[2]?' '+esc(x[2]):''}</span></div>`).join('');

/* =============== navigation & événements =============== */
$('home').onclick=()=>{ $('q').value=''; go({name:'home'}); };
document.addEventListener('click',e=>{
  const tile=e.target.closest('.tile'); if(tile){ startFlow(tile.dataset.flow); return; }
  const rc=e.target.closest('[data-recent]'); if(rc){ const r=recent[+rc.dataset.recent]; if(r) go(r.view); return; }
  const opt=e.target.closest('.opt'); if(opt){ pickOpt(opt.dataset.v); return; }
  const crumb=e.target.closest('.crumbs button'); if(crumb){ const s=+crumb.dataset.step; if(s<0){ view.step=0; } else view.step=s; render(); return; }
  if(e.target.id==='wnext'){ nextStep(); return; }
  if(e.target.id==='wskip'){ const step=FLOWS[view.flow].steps[view.step]; view.answers[step.key]=step.multi?[]:''; nextStep(); return; }
  if(e.target.id==='back'){ if(view.from==='wizard'&&view.wiz){ go(view.wiz); } else go({name:'home'}); return; }
  if(e.target.id==='askconfig'){ openChat(); sendChat(view.brief, 'Configuration complète : '+(view.title||'')); return; }
  if(e.target.id==='askthis'){ openChat(); sendChat(view.q); return; }
  const chipb=e.target.closest('.filters .chip'); if(chipb){ const k=chipb.dataset.k, v=chipb.dataset.v; if(k==='reset') F={design:'',mount:'',ip:false,nw:false}; else if(k==='ip'||k==='nw') F[k]=!F[k]; else F[k]=F[k]===v?'':v; render(); return; }
  const add=e.target.closest('.add'); if(add){ const it=byF[add.closest('.card').dataset.f]; if(it) addToList(it,add); return; }
  const ref=e.target.closest('.add-ref'); if(ref){ const it=byF[ref.dataset.f]; if(it) addToList(it,ref); else toast('Référence hors base'); return; }
  const mb=e.target.closest('.more-btn'); if(mb){ const card=mb.closest('.card'); const open=mb.getAttribute('aria-expanded')==='true'; card.querySelector('.more')?.remove(); if(!open) card.insertAdjacentHTML('beforeend',specHtml(byF[card.dataset.f])); mb.setAttribute('aria-expanded',String(!open)); mb.textContent=open?'Détails':'Masquer'; return; }
  const z=e.target.closest('[data-zoom]'); if(z){ const it=byF[z.dataset.zoom]; $('lb').innerHTML=`<img src="${esc(it.img)}" alt=""><div class="cap">${esc(it.d)} · ELDAS ${esc(it.e||'—')}</div>`; $('lb').hidden=false; return; }
  if(e.target.closest('#lb')){ $('lb').hidden=true; return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('lb').hidden=true; closeList(); if(window.innerWidth<=1000) closeChat(); } });

function startFlow(flow){
  if(flow==='nouveautes'){ F={design:'',mount:'',ip:false,nw:true}; go({name:'results', title:'Nouveautés 2025–2026', q:''}); return; }
  go({name:'wizard', flow, step:0, answers:{}});
}
function pickOpt(v){
  const step=FLOWS[view.flow].steps[view.step];
  if(step.multi){ const cur=view.answers[step.key]||[]; view.answers[step.key]= cur.includes(v)? cur.filter(x=>x!==v) : [...cur,v]; render(); }
  else { view.answers[step.key]=v; nextStep(); }
}
function nextStep(){
  const flow=FLOWS[view.flow];
  if(view.step < flow.steps.length-1){ view.step++; render(); return; }
  finishFlow();
}
function finishFlow(){
  const flow=FLOWS[view.flow], a=view.answers, wiz={...view};
  const label = s => { const st=flow.steps.find(x=>x.key===s); const val=a[s]; if(!st||!val||(Array.isArray(val)&&!val.length)) return ''; return Array.isArray(val)? val.map(v=>(st.opts.find(o=>o.v===v)||{}).t||v).join(', ') : ((st.opts.find(o=>o.v===val)||{}).t||val); };
  if(flow.assistant){
    const brief = `Projet bornes de recharge. Contexte : ${label('ctx')||'à préciser'} ; places : ${label('places')||'à préciser'} ; type : ${label('type')||'à préciser'} ; raccordement véhicule : ${label('cable')||'à préciser'} ; connectivité : ${label('conn')||'à préciser'} ; gestion de charge : ${label('lm')||'à préciser'} ; accès/facturation : ${label('bill')||'à préciser'}. Propose l'architecture, la liste de matériel catalogue (protections, distribution, mesure) avec N° ELDAS, les points à vérifier, et 2 upsells max. Ne me repose pas les questions déjà répondues.`;
    remember(`Bornes · ${label('ctx')} · ${label('places')} pl.`, wiz);
    go({name:'home'}); openChat(); sendChat(brief, `Projet bornes : ${[label('ctx'),label('places')&&label('places')+' places',label('type'),label('lm')&&'gestion '+label('lm')].filter(Boolean).join(' · ')}`); return;
  }
  F={design:'',mount:'',ip:false,nw:false};
  let groups=[], title='', brief='';
  if(view.flow==='tableau'){
    const fam=a.fam||'', rows=a.rows?`${a.rows} rangées`:''; const m=a.mount||'';
    groups.push({label:`Coffrets ${fam}`, q:`coffret ${fam} ${rows} ${m}`.trim()});
    (a.prot||[]).filter(Boolean).forEach(p=>groups.push({label:p==='differentiel'?'Disjoncteurs différentiels Clario iC40':'Disjoncteurs Clario iC40', q:`${p==='differentiel'?'disjoncteur differentiel':'disjoncteur'} clario`}));
    title=`Tableau ${fam} ${rows} ${MOUNT[m]||''}`.replace(/\s+/g,' ').trim();
    brief=`Tableau ${fam||''} ${rows} ${MOUNT[m]||''}, protections : ${label('prot')||'à définir'}. Propose la configuration complète du coffret (coffret, rails, différentiels, disjoncteurs, parafoudre si pertinent) avec N° ELDAS et 2 upsells max. Ne me repose pas ces questions.`;
  } else {
    const ctx={design:a.design||'', mount:a.mount||'', smart:a.smart||''};
    if(view.flow==='exterieur') ctx.design='NEVO';
    const fns=(a.fn&&a.fn.length)?a.fn:['interrupteur','prise'];
    fns.forEach(fn=>groups.push({label:FN_LABEL[fn], q:FN_QUERY[fn](ctx)}));
    title=[ctx.smart, ctx.design, MOUNT[ctx.mount]].filter(Boolean).join(' · ')||flow.title;
    brief=`${flow.title} : ligne ${ctx.design||'au choix'}, montage ${MOUNT[ctx.mount]||'à préciser'}${ctx.smart?`, niveau connecté ${ctx.smart}`:''}, fonctions : ${fns.map(f=>FN_LABEL[f]).join(', ')}. Propose une configuration type pour une pièce avec N° ELDAS (accessoires inclus) et 2 à 3 upsells. Ne me repose pas ces questions.`;
  }
  remember(title, {name:'results', title, groups, brief, from:'wizard', wiz});
  go({name:'results', title, groups, brief, from:'wizard', wiz});
}
function remember(label, v){ recent=[{label, view:v}, ...recent.filter(r=>r.label!==label)].slice(0,6); store.set('offre.recent',recent); }

$('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const q=$('q').value.trim(); if(!q) return; if(/\?|^(est|quel|quelle|comment|pourquoi|peut|combien|y a|propose|je veux|il me faut|client)/i.test(q) || q.split(' ').length>6){ openChat(); sendChat(q); $('q').value=''; } } });

function addToList(it,btn){ const ex=list.find(x=>x.f===it.f); if(ex) ex.q+=1; else list.push({f:it.f,e:it.e,d:it.d,q:1,img:it.img}); saveList(); if(btn){ btn.textContent='Ajouté ✓'; setTimeout(()=>btn.textContent='Ajouter encore',900);} toast(`${it.d.slice(0,40)}… ajouté`, {label:'Voir la liste', fn:openList}); }
function renderList(){
  const tot=list.reduce((a,x)=>a+x.q,0);
  $('badge').textContent=tot; $('n').textContent = list.length ? `${tot} pièce${tot>1?'s':''}` : '';
  $('aside-empty').style.display = list.length?'none':'block';
  $('items').innerHTML = list.map((x,i)=>`<div class="item"><img src="${esc(x.img||PIC(x.f))}" alt="" onerror="this.style.visibility='hidden'"><div><div class="d">${esc(x.d)}</div><div class="e num">ELDAS ${esc(x.e||'—')} · ${esc(x.f)}</div></div><input class="q num" type="number" min="1" step="1" value="${x.q}" data-i="${i}" aria-label="Quantité"><button class="x" type="button" data-i="${i}" aria-label="Retirer">×</button></div>`).join('');

$('items').addEventListener('click',e=>{ const b=e.target.closest('.x'); if(!b) return; list.splice(+b.dataset.i,1); saveList(); });
['c_name','c_notes'].forEach(id=>$(id).addEventListener('input',()=>{ client={name:$('c_name').value,notes:$('c_notes').value}; store.set('offre.client',client); }));

/* =============== assistant =============== */
const STARTERS=[
  {b:'Configuration d\'une pièce', t:'Rénovation appartement, le client veut du connecté sans bus'},
  {b:'Compatibilité', t:'Le thermostat Matter est-il compatible Philips Hue ?'},
  {b:'Projet bornes', t:'Projet 6 bornes de recharge pour une PPE'},
  {b:'Remplacement', t:'Quel remplaçant pour la référence 7563.FMI.61 en EDIZIO.liv ?'},
];
function openChat(){ chatOpen=true; $('stage').classList.add('chat-open'); renderChat(); setTimeout(()=>$('cin').focus(),50); }
function closeChat(){ chatOpen=false; $('stage').classList.remove('chat-open'); }
$('openchat').onclick=()=>chatOpen?closeChat():openChat(); $('chatclose').onclick=closeChat;
$('chatreset').onclick=()=>{ chat=[]; chatMeta=[]; renderChat(); };
function renderChat(state){
  const th=$('thread');
  if(!chat.length && !state){ th.innerHTML=`<div class="msg a">Dis-moi le besoin du client. Je pose deux ou trois questions à choix, puis je te donne la configuration avec les N° ELDAS et des options à proposer.</div><div class="starters">${STARTERS.map(s=>`<button type="button" data-starter="${esc(s.t)}"><b>${esc(s.b)}</b>${esc(s.t)}</button>`).join('')}</div>`; return; }
  th.innerHTML = chat.map((m,i)=>{
    if(m.role==='user'){ const dm=chatMeta[i]&&chatMeta[i].display; return `<div class="msg u">${esc(dm||m.content)}</div>`; }
    const meta=chatMeta[i]||{};
    const refs=(meta.refs||[]).map(x=>`<button type="button" class="add-ref" data-f="${esc(x.f)}" title="${esc(x.d)}"><img src="${PIC(x.f)}" alt="" onerror="this.remove()">+ ${esc(x.e)} · ${esc(x.d.slice(0,34))}${x.d.length>34?'…':''}</button>`).join('');
    const qs=(meta.questions&&meta.questions.length&&i===chat.length-1)?questionsHtml(meta.questions):'';
    return `${m.content?`<div class="msg a">${md(m.content)}${refs?`<div class="refs">${refs}</div>`:''}</div>`:''}${qs}`;
  }).join('') + (state==='loading'?`<div class="msg think">L'assistant cherche dans le catalogue<span class="dot"></span></div>`: state?`<div class="msg a" style="color:var(--danger)">${esc(state)}</div>`:'');
  th.scrollTop=th.scrollHeight;
}
function questionsHtml(qs){
  return `<div class="qs" id="qs">${qs.map((q,qi)=>`<div class="q">${esc(q.q)}</div><div class="o" data-qi="${qi}" data-multi="${q.multi?1:0}">${q.options.map(o=>`<button type="button" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`).join('')}<div class="send"><button class="btn primary small" type="button" id="qsend" disabled>Envoyer les réponses</button><small>ou écris librement ci-dessous</small></div></div>`;
}
$('thread').addEventListener('click',e=>{
  const st=e.target.closest('[data-starter]'); if(st){ sendChat(st.dataset.starter); return; }
  const ob=e.target.closest('.qs .o button'); if(ob){ const grp=ob.parentElement; if(grp.dataset.multi==='1'){ ob.setAttribute('aria-pressed',String(ob.getAttribute('aria-pressed')!=='true')); } else { grp.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false')); ob.setAttribute('aria-pressed','true'); } $('qsend').disabled=!$('qs').querySelector('[aria-pressed="true"]'); return; }
  if(e.target.id==='qsend'){ const meta=chatMeta[chatMeta.length-1]; const ans=meta.questions.map((q,qi)=>{ const sel=[...$('qs').querySelectorAll(`.o[data-qi="${qi}"] button[aria-pressed="true"]`)].map(b=>b.dataset.o.replace(/\s*\(recommandé\)\s*/i,'')); return sel.length?`${q.q} ${sel.join(', ')}`:null; }).filter(Boolean).join(' · '); if(ans) sendChat(ans); return; }
});
async function sendChat(text, display){
  text=(text||'').trim(); if(!text) return;
  if(!accessCode){ showGate(''); return; }
  if(!chatOpen) openChat();
  chat.push({role:'user',content:text}); chatMeta.push(display?{display}:null); renderChat('loading'); $('cin').value=''; $('csend').disabled=true;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-access-code':accessCode},body:JSON.stringify({messages:chat,list:list.map(x=>({q:x.q,d:x.d,e:x.e}))})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){ chat.pop(); chatMeta.pop(); accessCode=''; store.set('offre.code',''); renderChat(); showGate("Code d'accès incorrect."); return; }
    if(!r.ok){ chat.pop(); chatMeta.pop(); renderChat(`${j.error||'Assistant indisponible.'}${j.detail?' — '+j.detail:''}`); return; }
    chat.push({role:'assistant',content:j.answer||''}); chatMeta.push({refs:j.refs||[],searches:j.searches||[],questions:j.questions||[]});
    renderChat();
  }catch(e){ chat.pop(); chatMeta.pop(); renderChat("Pas de connexion à l'assistant."); }
  finally{ $('csend').disabled=false; }
}
$('csend').onclick=()=>sendChat($('cin').value);
$('cin').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat($('cin').value); } });
$('cin').addEventListener('input',()=>{ const t=$('cin'); t.style.height='auto'; t.style.height=Math.min(120,t.scrollHeight)+'px'; });

/* =============== voix =============== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function wireMic(btn, onText){
  if(!SR){ btn.disabled=true; btn.title='Dictée non disponible dans ce navigateur'; return; }
  let rec=null, listening=false;
  btn.onclick=()=>{ if(listening){ rec.stop(); return; }
    rec=new SR(); rec.lang='fr-CH'; rec.interimResults=true; rec.continuous=false; let final='';
    rec.onstart=()=>{ listening=true; btn.classList.add('listening'); };
    rec.onresult=e=>{ final=[...e.results].map(r=>r[0].transcript).join(' '); onText(final,false); };
    rec.onerror=e=>{ toast(e.error==='not-allowed'?'Micro refusé : autorise le microphone pour ce site.':'Dictée interrompue, réessaie.'); };
    rec.onend=()=>{ listening=false; btn.classList.remove('listening'); if(final) onText(final,true); };
    rec.start(); };
}
wireMic($('mic'),(t,done)=>{ $('q').value=t; if(done){ if(/\?|^(est|quel|quelle|comment|pourquoi|peut|combien|y a|propose|je veux|il me faut|client)/i.test(t)||t.split(' ').length>6){ openChat(); sendChat(t); $('q').value=''; } else { F={design:'',mount:'',ip:false,nw:false}; go({name:'results',q:t}); } } });
wireMic($('cmic'),(t,done)=>{ $('cin').value=t; if(done) sendChat(t); });

/* =============== thème & init =============== */
$('theme').onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme = cur==='dark'?'light':'dark'; store.set('offre.theme',r.dataset.theme); };
const th=store.get('offre.theme',null); if(th) document.documentElement.dataset.theme=th;
renderList(); render();
if(window.innerWidth>1000 && accessCode) { /* panneau fermé par défaut : la recherche d'abord */ }
</script>
